<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Staf - Sistem Pengurusan IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header / Navibar -->
    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
        <div>
            <h1 class="font-bold text-xl">Sistem Pengurusan IT</h1>
            <p class="text-xs text-blue-200">Portal Aduan Kerosakan IKTBN</p>
        </div>
        <div class="flex items-center gap-4">
            <span id="user-email" class="text-sm font-medium bg-blue-800 px-3 py-1 rounded">Memuatkan...</span>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">Log Keluar</button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Borang Aduan Kerosakan -->
        <div class="bg-white p-6 rounded-xl shadow-md md:col-span-1">
            <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">Hantar Aduan Baharu</h2>
            <form id="complaint-form" onsubmit="submitComplaint(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Tajuk Aduan / Kerosakan</label>
                    <input type="text" id="title" required placeholder="Cth: PC Tak Boleh On" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Kategori Kerosakan</label>
                    <select id="category" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Pilih Kategori</option>
                        <option value="Perkakasan (Hardware)">Perkakasan (Hardware)</option>
                        <option value="Perisian (Software)">Perisian (Software)</option>
                        <option value="Rangkaian / Rangkaian Wi-Fi">Rangkaian / Wi-Fi</option>
                        <option value="Pencetak (Printer)">Pencetak (Printer)</option>
                        <option value="Lain-lain">Lain-lain</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Lokasi / Bilik / Makmal</label>
                    <input type="text" id="location" required placeholder="Cth: Makmal Komputer 2" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Penerangan Kerosakan</label>
                    <textarea id="description" rows="3" required placeholder="Terangkan butiran masalah..." class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-semibold text-sm transition">Hantar Aduan</button>
            </form>
        </div>

        <!-- Senarai Aduan Saya -->
        <div class="bg-white p-6 rounded-xl shadow-md md:col-span-2">
            <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">Rekod Aduan Saya</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-2">Tajuk</th>
                            <th class="p-2">Lokasi</th>
                            <th class="p-2">Tarikh</th>
                            <th class="p-2">Status</th>
                        </tr>
                    </thead>
                    <tbody id="complaints-list">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-gray-400">Memuatkan senarai aduan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        // Semak Sesi Log Masuk
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = session.user;
            document.getElementById('user-email').innerText = currentUser.email;
            loadMyComplaints();
        }

        // Muat Turun Senarai Aduan Staf
        async function loadMyComplaints() {
            const { data, error } = await supabase
                .from('complaints')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('complaints-list');
            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Tiada aduan dihantar lagi.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2 font-medium">${item.title}</td>
                    <td class="p-2 text-gray-600">${item.location || '-'}</td>
                    <td class="p-2 text-gray-500">${new Date(item.created_at).toLocaleDateString('ms-MY')}</td>
                    <td class="p-2">${getStatusBadge(item.status)}</td>
                </tr>
            `).join('');
        }

        // Lencana Status Aduan
        function getStatusBadge(status) {
            switch(status) {
                case 'BARU': return '<span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs font-semibold">BARU</span>';
                case 'PROSES': return '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-semibold">DALAM PROSES</span>';
                case 'SELESAI': return '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-semibold">SELESAI</span>';
                default: return '<span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-xs font-semibold">' + (status || 'BARU') + '</span>';
            }
        }

        // Hantar Aduan Baharu
        async function submitComplaint(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'Menghantar...';

            const newComplaint = {
                user_id: currentUser.id,
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                location: document.getElementById('location').value,
                description: document.getElementById('description').value,
                status: 'BARU'
            };

            const { error } = await supabase.from('complaints').insert([newComplaint]);

            if (error) {
                alert('Gagal menghantar aduan: ' + error.message);
            } else {
                alert('Aduan berjaya dihantar!');
                document.getElementById('complaint-form').reset();
                loadMyComplaints();
            }

            btn.disabled = false;
            btn.innerText = 'Hantar Aduan';
        }

        // Log Keluar
        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        checkAuth();
    </script>
</body>
</html>
