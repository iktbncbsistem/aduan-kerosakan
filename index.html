<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Borang Permohonan Penyenggaraan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        /* Style Tambahan Untuk Animasi Mobile */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- ============================================================== -->
    <!-- VERSI MOBILE (GAYA OCTO) - Hanya dipapar pada skrin kecil      -->
    <!-- ============================================================== -->
    <div class="block lg:hidden w-full h-[100dvh] bg-slate-50 relative flex flex-col overflow-hidden no-scrollbar">
        <!-- Header Bertindih -->
        <div class="bg-gradient-to-br from-slate-900 to-blue-900 pt-10 pb-16 px-6 text-white relative flex-shrink-0">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-[11px] text-blue-200 mb-0.5">Selamat datang,</p>
                    <h1 id="mob-user-name" class="text-base font-bold leading-tight uppercase truncate max-w-[200px]">Pengguna</h1>
                    <p class="text-[9px] bg-blue-800/50 inline-block px-2 py-0.5 rounded-full mt-1.5 font-medium border border-blue-700/50 tracking-wider">STAF ILKBS</p>
                </div>
                <button onclick="logout()" class="w-8 h-8 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center transition border border-white/20"><i class="fa-solid fa-right-from-bracket text-xs"></i></button>
            </div>
        </div>

        <!-- Kad Utama (Kategori & Rekod) -->
        <div class="bg-slate-50 -mt-6 rounded-t-3xl flex-1 overflow-y-auto px-5 pt-6 pb-24 relative z-10 no-scrollbar">
            
            <!-- KAD MENU PENGURUSAN (GAYA TNG EWALLET) -->
            <div id="mob-admin-panel" class="hidden mb-6 bg-white pt-4 pb-5 px-4 rounded-2xl shadow-[0_8px_20px_rgba(0,0,0,0.04)] border border-slate-100">
                <div id="mob-admin-grid" class="flex justify-center gap-6"></div>
            </div>
            
            <h2 class="text-xs font-extrabold text-slate-800 mb-3 tracking-wide">JENIS SELENGGARA</h2>
            <div class="grid grid-cols-4 gap-2 mb-6">
                <button onclick="setMobileCategory('Peralatan / Mesin')" class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 hover:border-orange-500 active:scale-95"><div class="text-orange-500 text-lg"><i class="fa-solid fa-toolbox"></i></div><span class="text-[8px] font-bold text-slate-600 text-center leading-tight">Mesin</span></button>
                <button onclick="setMobileCategory('Infrastruktur')" class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 hover:border-amber-500 active:scale-95"><div class="text-amber-500 text-lg"><i class="fa-solid fa-building"></i></div><span class="text-[8px] font-bold text-slate-600 text-center leading-tight">Infrastruktur</span></button>
                <button onclick="setMobileCategory('Peralatan ICT')" class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 hover:border-blue-500 active:scale-95"><div class="text-blue-500 text-lg"><i class="fa-solid fa-laptop"></i></div><span class="text-[8px] font-bold text-slate-600 text-center leading-tight">ICT</span></button>
                <button onclick="setMobileCategory('Lain-lain')" class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 hover:border-slate-500 active:scale-95"><div class="text-slate-500 text-lg"><i class="fa-solid fa-ellipsis"></i></div><span class="text-[8px] font-bold text-slate-600 text-center leading-tight">Lain-lain</span></button>
            </div>

            <div class="flex justify-between items-end mb-3 border-b border-slate-200 pb-2">
                <h2 class="text-xs font-extrabold text-slate-800 tracking-wide">STATUS ADUAN SAYA</h2>
                <span class="text-[9px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded font-bold" id="mob-total">0 Rekod</span>
            </div>
            <div id="mob-list" class="space-y-3 pb-4">
                <div class="text-center p-6 text-slate-400 text-xs font-medium bg-white rounded-xl border border-slate-100">Memuatkan data...</div>
            </div>
        </div>

        <!-- Bottom Nav (Terapung) -->
        <div class="absolute bottom-0 w-full bg-slate-900 text-slate-400 rounded-t-3xl pt-2 pb-6 px-6 z-40 flex justify-between items-center shadow-[0_-10px_20px_rgba(0,0,0,0.1)]">
            <button onclick="closeMobModal()" class="flex flex-col items-center gap-1 text-white"><i class="fa-solid fa-house text-lg"></i><span class="text-[9px] font-bold">Utama</span></button>
            <button class="flex flex-col items-center gap-1 opacity-50 mr-4"><i class="fa-solid fa-clock-rotate-left text-lg"></i><span class="text-[9px] font-bold">Sejarah</span></button>
            <button onclick="openMobModal()" class="absolute left-1/2 -translate-x-1/2 -top-6 w-16 h-16 bg-red-600 text-white rounded-full flex flex-col items-center justify-center shadow-lg border-4 border-slate-50 hover:bg-red-700 hover:scale-105 transition-transform"><i class="fa-solid fa-qrcode text-xl mb-0.5"></i><span class="text-[8px] font-bold tracking-widest">LAPOR</span></button>
            <button class="flex flex-col items-center gap-1 opacity-50 ml-4"><i class="fa-solid fa-bell text-lg"></i><span class="text-[9px] font-bold">Notis</span></button>
            <button onclick="logout()" class="flex flex-col items-center gap-1"><i class="fa-solid fa-user text-lg"></i><span class="text-[9px] font-bold">Profil</span></button>
        </div>

        <!-- Modal Borang Mobile -->
        <div id="mob-modal" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex flex-col justify-end backdrop-blur-sm">
            <div class="bg-white rounded-t-3xl h-[85%] w-full flex flex-col shadow-2xl slide-up">
                <div class="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50 rounded-t-3xl">
                    <h3 class="font-extrabold text-sm text-slate-800"><i class="fa-solid fa-file-pen text-red-500 mr-1.5"></i> Borang Aduan</h3>
                    <button type="button" onclick="closeMobModal()" class="w-7 h-7 bg-slate-200 text-slate-600 rounded-full font-bold">&times;</button>
                </div>
                <div class="p-5 overflow-y-auto flex-1 bg-white">
                    <form id="mob-form" onsubmit="submitMobileComplaint(event)" class="space-y-4 text-xs pb-6">
                        <!-- KOTAK PILIHAN LOKASI (ROLLER PICKER) -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold text-slate-500 uppercase mb-1">Lokasi</label>
                                <button type="button" onclick="openCustomPicker('mob-dept', 'Pilih Lokasi')" class="w-full border border-slate-300 rounded-xl p-3 bg-slate-50 outline-none flex justify-between items-center text-xs font-bold text-slate-700 active:scale-95 transition">
                                    <span id="mob-dept-display" class="text-slate-400">Pilih Lokasi</span>
                                    <i class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
                                </button>
                                <input type="hidden" id="mob-dept" required>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-500 uppercase mb-1">No. Telefon</label>
                                <input type="tel" id="mob-phone" required placeholder="0123..." class="w-full border border-slate-300 rounded-xl p-3 bg-slate-50 outline-none">
                            </div>
                        </div>

                        <!-- KOTAK PILIHAN JENIS KEROSAKAN (ROLLER PICKER) -->
                        <div id="mob-cat-container">
                            <label class="block font-bold text-slate-500 uppercase mb-1">Jenis Kerosakan</label>
                            <button type="button" onclick="openCustomPicker('mob-cat', 'Pilih Jenis Kerosakan')" class="w-full border border-slate-300 rounded-xl p-3 bg-slate-50 outline-none flex justify-between items-center text-xs font-bold text-slate-700 active:scale-95 transition">
                                <span id="mob-cat-display" class="text-slate-400">Pilih Jenis</span>
                                <i class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
                            </button>
                            <input type="hidden" id="mob-cat">
                        </div>
                        <div><label class="block font-bold text-slate-500 uppercase mb-1">Butiran Kerosakan</label><textarea id="mob-details" required rows="3" class="w-full border border-slate-300 rounded-xl p-3 bg-slate-50 outline-none" placeholder="Terangkan kerosakan..."></textarea></div>
                        <div><label class="block font-bold text-slate-500 uppercase mb-1">Justifikasi</label><textarea id="mob-justification" required rows="2" class="w-full border border-slate-300 rounded-xl p-3 bg-slate-50 outline-none" placeholder="Sebab permohonan..."></textarea></div>
                        <div><label class="block font-bold text-slate-500 uppercase mb-1">Anggaran Kos (RM)</label><input type="number" step="0.01" id="mob-cost" placeholder="0.00" class="w-full border border-slate-300 rounded-xl p-3 bg-slate-50 outline-none mb-3"></div>

                        <div>
                            <label class="block font-bold text-slate-500 uppercase mb-1">Gambar Kerosakan (Boleh lebih dari 1)</label>
                            <div class="flex gap-2">
                                <label class="flex-1 bg-orange-50 text-orange-600 border border-orange-200 py-2.5 rounded-xl text-center cursor-pointer hover:bg-orange-100 transition">
                                    <input type="file" id="mob-cam" accept="image/*" capture="environment" multiple class="hidden" onchange="handleFileSelection(event)">
                                    <i class="fa-solid fa-camera mb-1 block text-lg"></i>
                                    <span class="text-[9px] font-bold">Kamera</span>
                                </label>
                                <label class="flex-1 bg-slate-50 text-slate-600 border border-slate-200 py-2.5 rounded-xl text-center cursor-pointer hover:bg-slate-100 transition">
                                    <input type="file" id="mob-gal" accept="image/*,.pdf" multiple class="hidden" onchange="handleFileSelection(event)">
                                    <i class="fa-solid fa-image mb-1 block text-lg"></i>
                                    <span class="text-[9px] font-bold">Galeri</span>
                                </label>
                            </div>
                            <div id="mob-file-name-preview" class="flex flex-col gap-1 mt-2"></div>
                        </div>
                        <button type="submit" id="mob-submit-btn" class="w-full bg-orange-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-2 active:scale-95 transition"><i class="fa-solid fa-paper-plane mr-1"></i> Hantar Permohonan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <!-- ============================================================== -->
    <!-- VERSI DESKTOP / PRO - KEKAL 100% ASAL                          -->
    <!-- ============================================================== -->
    <div class="hidden lg:block p-2 sm:p-4 md:p-6">
        <!-- Container Utama Dalam 1 Frame Bersatu -->
        <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl relative overflow-hidden border border-slate-200">
            
            <!-- Header Ringkas (Logo + Profil + Ikon Log Keluar Sebaris) -->
            <nav class="bg-white border-b border-slate-200 px-4 sm:px-6 py-2.5 flex justify-between items-center sticky top-0 z-50 shadow-sm">
                <span id="user-email-header" class="hidden"></span>

                <!-- Bahagian Kiri: Logo & Nama Pengguna -->
                <div class="flex items-center gap-2.5">
                    <img src="https://cetaoxubcdityyhcvtsy.supabase.co/storage/v1/object/public/logo/logo.png" alt="Logo" class="w-7 h-7 object-contain sys-logo">
                    <div class="flex flex-col">
                        <h1 class="font-bold text-xs sm:text-sm leading-tight text-slate-900">Aduan Kerosakan</h1>
                        <div id="name-view-mode" class="flex items-center gap-1">
                            <span id="display-name" class="text-[10px] text-slate-500 font-medium truncate max-w-[120px]">Memuatkan...</span>
                            <button type="button" onclick="toggleEditName(true)" class="text-[9px] text-blue-600 hover:underline font-bold bg-blue-50 px-1 py-0.5 rounded">Edit</button>
                        </div>
                        <div id="name-edit-mode" class="hidden flex items-center gap-1 mt-0.5">
                            <input type="text" id="edit-name-input" class="text-[10px] px-1.5 py-0.5 border border-slate-300 rounded focus:outline-none focus:border-blue-500">
                            <button type="button" onclick="saveProfileName()" class="bg-green-600 text-white text-[9px] px-1.5 py-0.5 rounded font-bold">OK</button>
                        </div>
                    </div>
                </div>

                <!-- Bahagian Kanan: Menu Dinamik + Avatar + Ikon Log Keluar -->
                <div class="flex items-center gap-2">
                    <div id="dynamic-menu" class="hidden mr-1"></div>
                    
                    <div class="w-7 h-7 rounded-full bg-orange-500 text-white font-bold text-xs flex items-center justify-center shadow-sm" id="user-avatar">
                        <i class="fa-solid fa-user text-[11px]"></i>
                    </div>

                    <!-- Butang Ikon Log Keluar (Sebaris dengan Avatar) -->
                    <button onclick="logout()" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors ml-1" title="Log Keluar">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    </button>
                </div>
            </nav> 

            <!-- Kandungan Utama Dalam Frame -->
            <div class="p-4 sm:p-6">
                <!-- Pill Tabs -->
                <div class="flex bg-slate-100 p-1 rounded-xl mb-5 sm:mb-6 max-w-md mx-auto border border-slate-200">
                    <button id="btn-tab-form" onclick="switchTab('form')" class="flex-1 py-2 text-xs sm:text-sm font-bold text-slate-800 bg-white rounded-lg shadow-sm transition-all">
                        📋 Borang
                    </button>
                    <button id="btn-tab-records" onclick="switchTab('records')" class="flex-1 py-2 text-xs sm:text-sm font-bold text-slate-500 hover:text-slate-800 rounded-lg transition-all">
                        📂 Rekod
                    </button>
                </div>

                <!-- TAB 1: Borang Aduan -->
                <div id="tab-form" class="space-y-4 sm:space-y-5">
                    <form id="complaint-form" onsubmit="submitComplaint(event)">
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wide">Jabatan / Lokasi</label>
                                <select id="department" required class="w-full border border-slate-300 rounded-lg p-2.5 text-xs sm:text-sm outline-none focus:border-orange-500 bg-white shadow-sm transition">
                                    <option value="">Pilih Lokasi...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wide">No. Telefon</label>
                                <input type="tel" id="phone" required placeholder="0123456789" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs sm:text-sm outline-none focus:border-orange-500 bg-white shadow-sm transition">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="block font-bold text-slate-500 uppercase mb-2">Jenis Kerosakan</label>
                            <div id="damage-types-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                <span class="text-xs text-slate-400">Memuatkan kategori...</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wide">Butiran Kerosakan</label>
                                <textarea id="details" rows="3" required placeholder="Terangkan masalah secara terperinci..." class="w-full border border-slate-300 rounded-xl p-3 text-xs sm:text-sm outline-none focus:border-orange-500 bg-slate-50 transition"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wide">Justifikasi</label>
                                <textarea id="justification" rows="3" required placeholder="Sebab munasabah memohon penyenggaraan..." class="w-full border border-slate-300 rounded-xl p-3 text-xs sm:text-sm outline-none focus:border-orange-500 bg-slate-50 transition"></textarea>
                            </div>
                        </div>

                        <!-- Lampiran Layout -->
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-5">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                
                                <div class="md:col-span-1">
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Gambar Kerosakan</label>
                                    <div class="flex gap-2">
                                        <label class="flex-1 bg-orange-50 text-orange-600 border border-orange-200 hover:bg-orange-100 py-2 rounded-lg text-center text-xs font-bold shadow-sm cursor-pointer transition">
                                            <input type="file" id="camera-upload" accept="image/*" capture="environment" multiple class="hidden" onchange="handleFileSelection(event)">
                                            📷 Kamera
                                        </label>
                                        <label class="flex-1 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 py-2 rounded-lg text-center text-xs font-bold shadow-sm cursor-pointer transition">
                                            <input type="file" id="gallery-upload" accept="image/*,.pdf" multiple class="hidden" onchange="handleFileSelection(event)">
                                            🖼️ Galeri
                                        </label>
                                    </div>
                                    <div id="file-name-preview" class="flex flex-col gap-1 mt-2"></div>
                                </div>

                                <div class="md:col-span-1">
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Sebutharga (Pilihan)</label>
                                    <input type="file" id="quotation-file" accept=".pdf,.doc,.docx,image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-white file:border file:border-slate-300 file:text-slate-700 file:font-semibold hover:file:bg-slate-100 cursor-pointer">
                                </div>
                                
                                <div class="md:col-span-1">
                                    <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Anggaran Kos (RM)</label>
                                    <input type="number" step="0.01" id="estimated-cost" placeholder="0.00" class="w-full border border-slate-300 rounded-lg p-2 text-xs sm:text-sm outline-none focus:border-orange-500 bg-white transition">
                                </div>
                            </div>
                        </div>

                        <button type="submit" id="submit-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold text-sm shadow-md transition active:scale-[0.99]"><i class="fa-solid fa-paper-plane mr-1.5"></i> Hantar Permohonan</button>
                    </form>
                </div>

                <!-- TAB 2: Rekod Aduan -->
                <div id="tab-records" class="hidden space-y-4">
                    <div id="complaints-list" class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                        <div class="p-6 text-center text-slate-400 font-medium border rounded-xl bg-slate-50 md:col-span-2 text-xs">Memuatkan senarai...</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ============================================================== -->
    <!-- MODAL PERINCIAN ADUAN (UNTUK PEMOHON)                          -->
    <!-- ============================================================== -->
    <div id="view-complaint-modal" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-bold text-slate-800"><i class="fa-solid fa-file-invoice text-orange-500 mr-2"></i>Perincian Aduan</h3>
                <button onclick="closeViewComplaintModal()" class="w-8 h-8 bg-slate-200 text-slate-600 rounded-full hover:bg-red-500 hover:text-white transition">&times;</button>
            </div>
            <div class="p-4 overflow-y-auto space-y-4">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Tarikh Aduan</p>
                        <p id="view-date" class="font-bold text-sm text-slate-700"></p>
                    </div>
                    <div id="view-status-badge"></div>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Kategori Kerosakan</p>
                    <p id="view-types" class="text-sm font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded inline-block border border-orange-100"></p>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Butiran Kerosakan</p>
                    <p id="view-details" class="text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-100 whitespace-pre-wrap"></p>
                </div>
                
                <!-- KOTAK KEPUTUSAN KCPPP (Hanya muncul jika ada) -->
                <div id="pemohon-kcppp-section" class="mt-4 p-3 bg-purple-50 rounded-xl border border-purple-200 hidden">
                    <p class="text-[10px] font-bold text-purple-700 uppercase mb-1">
                        <i class="fa-solid fa-check-double mr-1"></i>Keputusan KCPPP: 
                        <span id="pemohon-kcppp-action" class="text-purple-900 bg-purple-100 px-2 py-0.5 rounded ml-1"></span>
                    </p>
                    <p id="pemohon-kcppp-remarks" class="text-xs text-slate-700 italic mt-1.5"></p>
                </div>

            </div>
            <div class="p-4 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                <button onclick="closeViewComplaintModal()" class="w-full py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-xs hover:bg-slate-300">Tutup</button>
            </div>
        </div>
    </div>

<!-- MODAL BOTTOM SHEET ROLLER PICKER (WHEEL STYLE) -->
    <div id="picker-modal" class="fixed inset-0 bg-slate-900/60 hidden z-[70] flex flex-col justify-end backdrop-blur-sm transition-all">
        <div class="bg-white rounded-t-3xl w-full shadow-2xl overflow-hidden slide-up">
            
            <!-- HEADER PICKER (BATAL & OK) -->
            <div class="flex justify-between items-center px-6 py-3.5 border-b border-slate-100 bg-white z-10 relative">
                <button type="button" onclick="closeCustomPicker()" class="text-xs font-bold text-rose-500 hover:text-rose-700 transition">Batal</button>
                <span id="picker-title" class="text-xs font-bold text-slate-700 uppercase tracking-wider">Pilih Lokasi</span>
                <button type="button" onclick="confirmCustomPicker()" class="text-xs font-bold text-rose-600 hover:text-rose-800 transition">OK</button>
            </div>

            <!-- RUANG SCROLL WHEEL -->

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); 
                    img.src = event.target.result;
                    img.onload = () => {
                        const MAX_WIDTH = 1200;
                        const MAX_HEIGHT = 1200;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width; 
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                        canvas.toBlob(blob => {
                            if(!blob) { reject(new Error('Gagal proses gambar.')); return; }
                            resolve(new File([blob], file.name, { type: mimeType }));
                        }, mimeType, 0.7); // Kualiti 70% supaya ringan
                    };
                    img.onerror = () => reject(new Error('Format gambar tidak disokong.'));
                };
                reader.onerror = () => reject(new Error('Gagal membaca fail.'));
            });
        }

            const { data, error } = await _supabase.from('complaints').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            
            rawMyComplaints = data || []; // Simpan dalam memori untuk fungsi modal

            // Render Desktop 
            const tbody = document.getElementById('complaints-list');
            if (error || !data || data.length === 0) { 
                tbody.innerHTML = '<div class="p-6 text-center text-slate-400 font-medium border rounded-xl bg-slate-50 md:col-span-2 text-xs">Belum ada aduan.</div>'; 
            } else {
                tbody.innerHTML = data.map(item => `
                    <div onclick="openViewComplaintModal('${item.id}')" class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm hover:shadow-md hover:border-orange-300 transition cursor-pointer">
                        <div class="flex justify-between items-start mb-2.5">
                            <span class="text-[11px] text-slate-400 font-bold"><i class="fa-regular fa-calendar mr-1"></i>${new Date(item.created_at).toLocaleDateString('ms-MY')}</span>
                            ${getStatusBadge(item.status, item.updated_at || item.created_at)}
                        </div>
                        <h3 class="font-bold text-sm text-slate-800 mb-1">${Array.isArray(item.damage_types) ? item.damage_types.join(', ') : item.damage_types}</h3>
                        <p class="text-xs text-slate-500 line-clamp-2">${item.details || ''}</p>
                        <div class="mt-3 pt-2.5 border-t border-slate-100 text-[11px] font-bold text-slate-600 uppercase flex items-center">
                            <i class="fa-solid fa-location-dot mr-1.5 text-red-500"></i> ${item.department || '-'}
                        </div>
                    </div>
                `).join('');
            }

            // Render Mobile
            const mobTotal = document.getElementById('mob-total');
            if (mobTotal) mobTotal.innerText = data ? `${data.length} Rekod` : '0 Rekod';

            const mobList = document.getElementById('mob-list');
            if (error || !data || data.length === 0) {
                if(mobList) mobList.innerHTML = '<div class="text-center p-6 text-slate-400 text-xs font-medium bg-white rounded-xl border border-slate-100">Tiada rekod aduan.</div>';
            } else {
                if(mobList) {
                    mobList.innerHTML = data.map(item => {
                        let icon = 'fa-file-lines'; let color = 'text-slate-600 bg-slate-50';
                        if(item.damage_types && item.damage_types.includes('Peralatan / Mesin')) { icon = 'fa-toolbox'; color = 'text-orange-600 bg-orange-50'; }
                        else if(item.damage_types && item.damage_types.includes('Peralatan ICT')) { icon = 'fa-laptop'; color = 'text-blue-600 bg-blue-50'; }
                        else if(item.damage_types && item.damage_types.includes('Infrastruktur')) { icon = 'fa-building'; color = 'text-amber-600 bg-amber-50'; }

                        return `<div onclick="openViewComplaintModal('${item.id}')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex gap-3 items-center cursor-pointer active:scale-95 transition">
                            <div class="w-10 h-10 rounded-xl ${color} flex items-center justify-center text-lg flex-shrink-0"><i class="fa-solid ${icon}"></i></div>
                            <div class="flex-1 overflow-hidden">
                                <h3 class="text-[11px] font-bold text-slate-800 truncate">${Array.isArray(item.damage_types) ? item.damage_types.join(', ') : item.damage_types}</h3>
                                <p class="text-[9px] text-slate-500 truncate">${item.department} • ${new Date(item.created_at).toLocaleDateString('ms-MY')}</p>
                            </div>
                            <div class="flex-shrink-0">${getStatusBadgeMobile(item.status, item.updated_at || item.created_at)}
                            </div>
                        </div>`;
                    }).join('');
                }
            }
        }

       function getStatusBadge(status, dateStr) {
            let badgeHtml = '';
            switch(status) {
                case 'BARU': badgeHtml = '<span class="bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-md text-[10px] font-bold">BARU</span>'; break;
                case 'PROSES': badgeHtml = '<span class="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-md text-[10px] font-bold">PROSES</span>'; break;
                case 'SELESAI': badgeHtml = '<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md text-[10px] font-bold">SELESAI</span>'; break;
                default: badgeHtml = `<span class="bg-slate-100 text-slate-800 border border-slate-200 px-2 py-0.5 rounded-md text-[10px] font-bold">${status || 'BARU'}</span>`;
            }
            let dateHtml = dateStr ? `<div class="text-[9px] font-bold text-slate-400 ml-2"><i class="fa-regular fa-clock mr-1"></i>${new Date(dateStr).toLocaleDateString('ms-MY')}</div>` : '';
            return `<div class="flex items-center">${badgeHtml}${dateHtml}</div>`;
        }

        function getStatusBadgeMobile(status, dateStr) {
            let badgeHtml = '';
            switch(status) {
                case 'BARU': badgeHtml = '<span class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-[8px] font-bold uppercase">BARU</span>'; break;
                case 'PROSES': case 'SEDANG DIPROSES': badgeHtml = '<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-[8px] font-bold uppercase">PROSES</span>'; break;
                case 'SELESAI': badgeHtml = '<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-[8px] font-bold uppercase">SELESAI</span>'; break;
                default: badgeHtml = `<span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[8px] font-bold uppercase">${status || 'BARU'}</span>`;
            }
            let dateHtml = dateStr ? `<div class="text-[8px] font-bold text-slate-400 mt-1.5 text-right">${new Date(dateStr).toLocaleDateString('ms-MY')}</div>` : '';
            return `<div class="flex flex-col items-end">${badgeHtml}${dateHtml}</div>`;
        }

        async function logout() { await _supabase.auth.signOut(); window.location.href = 'login.html'; }
        
        checkAuth();

        async function loadSystemTheme() {
            const { data } = await _supabase.from('system_settings').select('*').in('setting_key', ['system_logo', 'login_bg']);
            if(data) {
                const logo = data.find(d => d.setting_key === 'system_logo');
                const sysLogoEls = document.querySelectorAll('.sys-logo');
                if(logo && logo.setting_value && sysLogoEls.length > 0) {
                    sysLogoEls.forEach(img => img.src = logo.setting_value);
                }
            }
        }
        loadSystemTheme(); 


        // ==========================================
        // FUNGSI CUSTOM ROLLER PICKER (WHEEL STYLE)
        // ==========================================
        let currentPickerTargetId = '';
        let currentSelectedValue = '';
        let pickerOptions = [];
        const ITEM_HEIGHT = 48; // Menyamai ketinggian h-12 (48px)

        function openCustomPicker(targetInputId, title, customOptions = null) {
            currentPickerTargetId = targetInputId;
            document.getElementById('picker-title').innerText = title;

            // Dapatkan senarai pilihan
            let options = customOptions;
            if (!options) {
                if (targetInputId === 'mob-dept') {
                    options = Array.from(document.querySelectorAll('#department option'))
                                   .map(o => o.value)
                                   .filter(v => v !== '');
                } else if (targetInputId === 'mob-cat') {
                    options = ["Peralatan / Mesin", "Infrastruktur", "Peralatan ICT", "Lain-lain"];
                }
            }

            if (!options || options.length === 0) {
                alert('Tiada pilihan tersedia.');
                return;
            }

            pickerOptions = options;
            currentSelectedValue = options[0];

            const listContainer = document.getElementById('picker-list');
            listContainer.innerHTML = options.map((opt, idx) => `
                <div class="picker-item h-12 flex items-center justify-center text-sm font-semibold text-slate-400 transition-all snap-center cursor-pointer select-none" onclick="scrollToPickerIndex(${idx})">
                    ${opt}
                </div>
            `).join('');

            document.getElementById('picker-modal').classList.remove('hidden');

            // Set scroll ke kedudukan 0 (item pertama di tengah) bila modal dibuka
            setTimeout(() => {
                const scrollContainer = document.getElementById('picker-items-container');
                scrollContainer.scrollTop = 0;
                updatePickerHighlight(0);
            }, 10);
        }

        // Kesan pergerakan scroll dan automatik detect item di tengah
        function handlePickerScroll(container) {
            let index = Math.round(container.scrollTop / ITEM_HEIGHT);
            
            // Pastikan tidak terkeluar limit tatasusunan (array)
            index = Math.max(0, Math.min(index, pickerOptions.length - 1));
            
            currentSelectedValue = pickerOptions[index];
            updatePickerHighlight(index);
        }

        // Fungsi jika pengguna klik terus pada teks untuk animate scroll ke tengah
        function scrollToPickerIndex(index) {
            const scrollContainer = document.getElementById('picker-items-container');
            scrollContainer.scrollTo({
                top: index * ITEM_HEIGHT,
                behavior: 'smooth'
            });
        }

        // Tukar warna hitam pekat bila masuk dalam garisan
        function updatePickerHighlight(activeIndex) {
            const items = document.querySelectorAll('.picker-item');
            items.forEach((el, idx) => {
                if (idx === activeIndex) {
                    el.className = "picker-item h-12 flex items-center justify-center text-base font-extrabold text-slate-900 transition-all snap-center cursor-pointer select-none";
                } else {
                    el.className = "picker-item h-12 flex items-center justify-center text-sm font-semibold text-slate-400 opacity-60 transition-all snap-center cursor-pointer select-none";
                }
            });
        }

        function confirmCustomPicker() {
            if (currentPickerTargetId && currentSelectedValue) {
                const hiddenInput = document.getElementById(currentPickerTargetId);
                if (hiddenInput) hiddenInput.value = currentSelectedValue;

                const displayEl = document.getElementById(`${currentPickerTargetId}-display`);
                if (displayEl) {
                    displayEl.innerText = currentSelectedValue;
                    displayEl.className = "text-slate-800 font-bold truncate";
                }
            }
            closeCustomPicker();
        }

        function closeCustomPicker() {
            document.getElementById('picker-modal').classList.add('hidden');
        }
        
    </script>
