    <script>
        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userProfile = null;

        // FUNGSI TAB DESKTOP ASAL
        function switchTab(tabId) {
            document.getElementById('tab-form').classList.add('hidden');
            document.getElementById('tab-records').classList.add('hidden');
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            const btnForm = document.getElementById('btn-tab-form');
            const btnRecords = document.getElementById('btn-tab-records');
            
            const activeClass = "flex-1 py-2 text-xs sm:text-sm font-bold text-slate-800 bg-white rounded-lg shadow-sm transition-all";
            const inactiveClass = "flex-1 py-2 text-xs sm:text-sm font-bold text-slate-500 hover:text-slate-800 rounded-lg transition-all";
            
            if (tabId === 'form') {
                btnForm.className = activeClass;
                btnRecords.className = inactiveClass;
            } else {
                btnRecords.className = activeClass;
                btnForm.className = inactiveClass;
                loadMyComplaints(); 
            }
        }

        // FUNGSI MODAL MOBILE
        function openMobModal() { 
            document.getElementById('mob-modal').classList.remove('hidden'); 
            setMobileCategory('');
        }
        function closeMobModal() { 
            document.getElementById('mob-modal').classList.add('hidden'); 
        }
        function setMobileCategory(catName) {
            document.getElementById('mob-modal').classList.remove('hidden');
            const s = document.getElementById('mob-cat');
            const c = document.getElementById('mob-cat-container');
            if(catName) {
                for(let i=0; i<s.options.length; i++) {
                    if(s.options[i].value.includes(catName) || catName.includes(s.options[i].value)) {
                        s.selectedIndex = i; break;
                    }
                }
                c.classList.add('hidden'); // Sorok dropdown jika pilih kategori pantas
            } else {
                s.selectedIndex = 0; c.classList.remove('hidden');
            }
        }

        // FUNGSI AUTHENTICATION
        async function checkAuth() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session) { window.location.href = 'login.html'; return; }
                currentUser = session.user;
                
                const emailHeader = document.getElementById('user-email-header');
                if(emailHeader) emailHeader.innerText = currentUser.email;

                const fullNameFallback = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email.split('@')[0];
                
                // Set nama untuk paparan Mobile
                document.getElementById('mob-user-name').innerText = fullNameFallback;

                let { data: profile } = await _supabase.from('user_profiles').select('*').eq('email', currentUser.email).maybeSingle();
                
                if (!profile) {
                    const { data: newProfile } = await _supabase.from('user_profiles').insert([{
                        email: currentUser.email, full_name: fullNameFallback, role: 'PENDING', is_blocked: false
                    }]).select().single();
                    profile = newProfile;
                }
                userProfile = profile;

                if (profile.role === 'PENDING' || profile.role === 'TIADA' || profile.is_blocked) {
                    document.body.innerHTML = `
                        <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center border border-slate-200">
                                <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">⚠️</div>
                                <h2 class="text-xl font-bold text-slate-800 mb-2">Menunggu Pengesahan</h2>
                                <p class="text-slate-600 text-xs mb-6 leading-relaxed">Akaun anda telah didaftarkan. Sila tunggu kelulusan daripada Pentadbir.</p>
                                <button onclick="logout()" class="w-full bg-slate-800 hover:bg-slate-900 text-white px-5 py-3 rounded-lg font-bold text-sm shadow transition">Log Keluar</button>
                            </div>
                        </div>`;
                    return;
                }

                updateProfileUI();

                const menuContainer = document.getElementById('dynamic-menu');
                menuContainer.innerHTML = '';
                const roleUpper = profile && profile.role ? profile.role.trim().toUpperCase() : 'STAF';

                if (roleUpper === 'ADMIN') {
                    menuContainer.innerHTML = `<a href="admin.html" class="bg-purple-50 text-purple-700 border border-purple-200 px-2.5 py-1 rounded-md text-[10px] font-bold shadow-sm hover:bg-purple-100 transition"><i class="fa-solid fa-gear mr-1"></i> Admin</a>`;
                } else if (roleUpper === 'CPPP') {
                    menuContainer.innerHTML = `<a href="cppp.html" class="bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-md text-[10px] font-bold shadow-sm hover:bg-blue-100 transition"><i class="fa-solid fa-wrench mr-1"></i> CPPP</a>`;
                } else if (roleUpper === 'KCPPP') {
                    menuContainer.innerHTML = `<a href="kcppp.html" class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-md text-[10px] font-bold shadow-sm hover:bg-emerald-100 transition"><i class="fa-solid fa-sliders mr-1"></i> KCPPP</a>`;

                if (!sessionStorage.getItem('sudah_redirect')) {

        let selectedAttachmentFiles = [];

            const files = event.target.files;

        function renderFilePreview() {
            const preview = document.getElementById('file-name-preview');
            preview.innerHTML = '';
            selectedAttachmentFiles.forEach((file, index) => {
                preview.innerHTML += `
                    <div class="flex items-center justify-between bg-orange-50 px-2 py-1 rounded text-xs border border-orange-100">
                        <span class="truncate text-orange-700 font-bold">📷 ${file.name}</span>
                        <button type="button" onclick="removeFile(${index})" class="text-red-500 hover:text-red-700 bg-red-100 rounded px-1.5 font-bold transition">&times;</button>
                    </div>`;
            });
        }

        function removeFile(index) {
            selectedAttachmentFiles.splice(index, 1);
            renderFilePreview();
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); 
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width; 
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, img.width, img.height);
                        const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                        canvas.toBlob(blob => {
                            resolve(new File([blob], file.name, { type: mimeType }));
                        }, mimeType, 0.8);
                    };
                };
            });
        }

        // FUNGSI SUBMIT UNTUK DESKTOP (Kekal 100% Fungsi Asal)
        async function submitComplaint(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = 'Memproses...';
            
            try {
                const selectedDamageTypes = Array.from(document.querySelectorAll('input[name="damage_types"]:checked')).map(cb => cb.value);
                if (selectedDamageTypes.length === 0) { alert('Sila pilih kategori kerosakan.'); btn.disabled = false; btn.innerText = 'Hantar Permohonan'; return; }
                
                let imageUrls = [];
                if (selectedAttachmentFiles.length > 0) {
                    for (let i = 0; i < selectedAttachmentFiles.length; i++) {
                        const compFile = await compressImage(selectedAttachmentFiles[i]);
                        const path = `images/${Date.now()}_${i}_${compFile.name}`;
                        const { error } = await _supabase.storage.from('complaint_attachments').upload(path, compFile);
                        if (!error) imageUrls.push(_supabase.storage.from('complaint_attachments').getPublicUrl(path).data.publicUrl);
                    }
                }
                const finalImageUrl = imageUrls.length > 0 ? imageUrls.join(',') : null;
                
                const quoteFile = document.getElementById('quotation-file').files[0];
                let quotationUrl = null;
                if (quoteFile) {
                    const path = `quotations/${Date.now()}_${quoteFile.name}`;
                    const { error } = await _supabase.storage.from('complaint_attachments').upload(path, quoteFile);
                    if (!error) quotationUrl = _supabase.storage.from('complaint_attachments').getPublicUrl(path).data.publicUrl;
                }

                const newComplaint = {
                    user_id: currentUser.id, full_name: userProfile.full_name, email: currentUser.email, 
                    phone: document.getElementById('phone').value, department: document.getElementById('department').value, 
                    damage_types: selectedDamageTypes, details: document.getElementById('details').value, 
                    justification: document.getElementById('justification').value,
                    estimated_cost: parseFloat(document.getElementById('estimated-cost').value || 0),
                    image_url: finalImageUrl, quotation_url: quotationUrl, status: 'BARU'
                };

                const { error } = await _supabase.from('complaints').insert([newComplaint]);
                if (error) throw error;
                
                alert('Berjaya dihantar!');
                
                const dept = document.getElementById('department').value;
                const details = document.getElementById('details').value || '-';
                const nama = document.getElementById('display-name').innerText;
                const { data: settingData } = await _supabase.from('system_settings').select('setting_value').eq('setting_key', 'whatsapp_no').single();
                let noAdmin = settingData ? settingData.setting_value.replace(/[^0-9]/g, '') : "60123456789";
                
                const mesejWA = `*ADUAN BARU*\n\n*Nama:* ${nama}\n*Lokasi:* ${dept}\n*Butiran:* ${details}`;
                window.open(`https://wa.me/${noAdmin}?text=${encodeURIComponent(mesejWA)}`, '_blank');
                
                document.getElementById('complaint-form').reset();
                selectedAttachmentFiles = []; renderFilePreview();
                switchTab('records');

            } catch (err) { alert('Ralat: ' + err.message); } 
            finally { btn.disabled = false; btn.innerText = 'Hantar Permohonan'; }
        }

        async function loadMyComplaints() {

            // Render Desktop (Kekal Asal)
            const tbody = document.getElementById('complaints-list');

                    </div>

            // Render Mobile

let icon = 'fa-file-lines'; let color = 'text-slate-600 bg-slate-50';
if(item.damage_types && item.damage_types.includes('Peralatan / Mesin')) { icon = 'fa-toolbox'; color = 'text-orange-600 bg-orange-50'; }
else if(item.damage_types && item.damage_types.includes('Peralatan ICT')) { icon = 'fa-laptop'; color = 'text-blue-600 bg-blue-50'; }

        function getStatusBadge(status) {
            switch(status) {
                case 'BARU': return '<span class="bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-md text-[10px] font-bold">BARU</span>';
                case 'PROSES': return '<span class="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-md text-[10px] font-bold">PROSES</span>';
                case 'SELESAI': return '<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md text-[10px] font-bold">SELESAI</span>';
                default: return `<span class="bg-slate-100 text-slate-800 border border-slate-200 px-2 py-0.5 rounded-md text-[10px] font-bold">${status || 'BARU'}</span>`;
            }
        }

        function getStatusBadgeMobile(status) {
            switch(status) {
                case 'BARU': return '<span class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-[8px] font-bold uppercase">BARU</span>';
                case 'PROSES': case 'SEDANG DIPROSES': return '<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-[8px] font-bold uppercase">PROSES</span>';
                case 'SELESAI': return '<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-[8px] font-bold uppercase">SELESAI</span>';
                default: return `<span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[8px] font-bold uppercase">${status || 'BARU'}</span>`;
            }
        }
