<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Borang Aduan Kerosakan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        /* Hilangkan scrollbar untuk paparan lebih ala-app */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-slate-50 pb-20">

    <!-- Header Ala WhatsApp / Social Media -->
    <nav class="bg-white border-b border-slate-200 p-3 sticky top-0 z-50 shadow-sm flex items-center gap-3">
        <!-- Logo Kecil -->
        <img src="https://via.placeholder.com/60x60.png?text=Logo" alt="Logo" class="w-10 h-10 rounded-lg object-contain bg-slate-100 p-1 border border-slate-200">
        
        <div class="flex-1">
            <h1 class="font-bold text-sm text-slate-900 leading-tight">E-Aduan Kerosakan</h1>
            <p class="text-[10px] text-emerald-600 font-semibold"><i class="fa-solid fa-circle text-[8px] mr-1"></i>Sistem Dalam Talian</p>
        </div>
        
        <!-- Gambar Profil Pengguna / Ikon Lalai -->
        <img src="https://via.placeholder.com/60x60.png?text=User" alt="Profil" class="w-9 h-9 rounded-full object-cover border-2 border-slate-200">
    </nav>

    <!-- Kandungan Borang -->
    <div class="p-4 max-w-md mx-auto">
        <form id="aduan-form" class="space-y-4 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            
            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nama Penuh</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                    <input type="text" id="fullname" required class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:border-orange-500 outline-none" placeholder="Masukkan nama...">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Lokasi / Jabatan</label>
                <div class="relative">
                    <i class="fa-solid fa-location-dot absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                    <select id="department" required class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:border-orange-500 outline-none appearance-none">
                        <option value="">Pilih Lokasi...</option>
                        <!-- Pilihan akan dimuat dari Supabase -->
                        <option value="Blok Pentadbiran">Blok Pentadbiran</option>
                        <option value="Bilik Kuliah">Bilik Kuliah</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Kategori Kerosakan</label>
                <div class="relative">
                    <i class="fa-solid fa-wrench absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                    <select id="damage-type" required class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:border-orange-500 outline-none appearance-none">
                        <option value="">Pilih Kategori...</option>
                        <option value="Perisian (Software)">Perisian (Software)</option>
                        <option value="Perkakasan (Hardware)">Perkakasan (Hardware)</option>
                        <option value="Lain-lain">Lain-lain</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Butiran Kerosakan</label>
                <textarea id="details" rows="3" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:bg-white focus:border-orange-500 outline-none" placeholder="Terangkan masalah kerosakan..."></textarea>
            </div>

            <!-- Bahagian Muat Naik Gambar Ala App -->
            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-2">Lampiran Gambar</label>
                <div class="flex gap-3">
                    <!-- Butang Kamera Sahaja -->
                    <label class="flex-1 bg-orange-50 border border-orange-200 text-orange-600 py-3 rounded-xl text-center text-xs font-bold shadow-sm active:bg-orange-100 transition cursor-pointer">
                        <input type="file" id="camera-upload" accept="image/*" capture="environment" class="hidden">
                        <i class="fa-solid fa-camera text-xl mb-1 block"></i> Buka Kamera
                    </label>
                    
                    <!-- Butang Galeri Fail -->
                    <label class="flex-1 bg-slate-50 border border-slate-300 text-slate-600 py-3 rounded-xl text-center text-xs font-bold shadow-sm active:bg-slate-100 transition cursor-pointer">
                        <input type="file" id="gallery-upload" accept="image/*" class="hidden">
                        <i class="fa-regular fa-image text-xl mb-1 block"></i> Buka Galeri
                    </label>
                </div>
                <div id="file-name-display" class="text-[10px] text-slate-500 mt-2 font-medium italic text-center">Tiada gambar dipilih</div>
            </div>

            <hr class="border-slate-100 my-2">

            <button type="submit" id="submit-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl shadow-md transition transform active:scale-95 flex justify-center items-center gap-2 text-sm">
                <i class="fa-solid fa-paper-plane"></i> Hantar Aduan
            </button>
        </form>
    </div>

    <script>
        // Papar nama fail apabila gambar dipilih (Kamera atau Galeri)
        const displayFileName = (e) => {
            const file = e.target.files[0];
            if(file) document.getElementById('file-name-display').innerHTML = `<span class="text-emerald-600 font-bold"><i class="fa-solid fa-check mr-1"></i> ${file.name} sedia untuk dihantar</span>`;
        };

        document.getElementById('camera-upload').addEventListener('change', displayFileName);
        document.getElementById('gallery-upload').addEventListener('change', displayFileName);

        // Skrip Supabase bos diletakkan di sini (insert aduan & upload storage)
    </script>
</body>
</html>
