<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Permohonan Penyenggaraan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

    </style>
</head>
<body class="bg-slate-100 min-h-screen p-2 sm:p-4 md:p-6">

    <!-- Container Utama Dalam 1 Frame Bersatu -->
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl relative overflow-hidden border border-slate-200">
        
        <!-- Header Ringkas (Logo + Profil + Ikon Log Keluar Sebaris) -->
        <nav class="bg-white border-b border-slate-200 px-4 sm:px-6 py-2.5 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <span id="user-email-header" class="hidden"></span>

            <!-- Bahagian Kiri: Logo & Nama Pengguna -->
            <div class="flex items-center gap-2.5">
                <img src="https://cetaoxubcdityyhcvtsy.supabase.co/storage/v1/object/public/logo/logo.png" alt="Logo" class="w-7 h-7 object-contain">
                <div class="flex flex-col">
                    <h1 class="font-bold text-xs sm:text-sm leading-tight text-slate-900">Aduan Kerosakan</h1>
                    <div id="name-view-mode" class="flex items-center gap-1">
                        <span id="display-name" class="text-[10px] text-slate-500 font-medium truncate max-w-[120px]">Memuatkan...</span>
                        <button type="button" onclick="toggleEditName(true)" class="text-[9px] text-blue-600 hover:underline font-bold bg-blue-50 px-1 py-0.5 rounded">Edit</button>
                    </div>
                    <div id="name-edit-mode" class="hidden flex items-center gap-1 mt-0.5">
                        <input type="text" id="edit-name-input" class="text-[10px] px-1.5 py-0.5 border border-slate-300 rounded focus:outline-none focus:border-blue-500">
                        <button type="button" onclick="saveProfileName()" class="bg-green-600 text-white text-[9px] px-1.5 py-0.5 rounded font-bold">OK</button>
                    </div>
                </div>
            </div>

            <!-- Bahagian Kanan: Menu Dinamik + Avatar + Ikon Log Keluar -->
            <div class="flex items-center gap-2">
                <div id="dynamic-menu" class="hidden mr-1"></div>
                
                <div class="w-7 h-7 rounded-full bg-orange-500 text-white font-bold text-xs flex items-center justify-center shadow-sm" id="user-avatar">
                    <i class="fa-solid fa-user text-[11px]"></i>
                </div>

                <!-- Butang Ikon Log Keluar (Sebaris dengan Avatar) -->
                <button onclick="logout()" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors ml-1" title="Log Keluar">
                    <i class="fa-solid fa-right-from-bracket text-sm"></i>
                </button>
            </div>
        </nav> 

        <!-- Kandungan Utama Dalam Frame -->
        <div class="p-4 sm:p-6">
            <!-- Pill Tabs -->
            <div class="flex bg-slate-100 p-1 rounded-xl mb-5 sm:mb-6 max-w-md mx-auto border border-slate-200">
                <button id="btn-tab-form" onclick="switchTab('form')" class="flex-1 py-2 text-xs sm:text-sm font-bold text-slate-800 bg-white rounded-lg shadow-sm transition-all">
                    📝 Borang
                </button>
                <button id="btn-tab-records" onclick="switchTab('records')" class="flex-1 py-2 text-xs sm:text-sm font-bold text-slate-500 hover:text-slate-800 rounded-lg transition-all">
                    📂 Rekod
                </button>
            </div>

            <!-- TAB 1: Borang Aduan -->
            <div id="tab-form" class="space-y-4 sm:space-y-5">
                <form id="complaint-form" onsubmit="submitComplaint(event)">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wide">Jabatan / Lokasi</label>
                            <select id="department" required class="w-full border border-slate-300 rounded-lg p-2.5 text-xs sm:text-sm outline-none focus:border-orange-500 bg-white shadow-sm transition">
                                <option value="">Pilih Lokasi...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wide">No. Telefon</label>
                            <input type="tel" id="phone" required placeholder="0123456789" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs sm:text-sm outline-none focus:border-orange-500 bg-white shadow-sm transition">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Kategori Kerosakan</label>
                        <div id="damage-types-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                            <span class="text-xs text-slate-400">Memuatkan kategori...</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wide">Butiran Kerosakan</label>
                            <textarea id="details" rows="3" required placeholder="Terangkan masalah secara terperinci..." class="w-full border border-slate-300 rounded-xl p-3 text-xs sm:text-sm outline-none focus:border-orange-500 bg-slate-50 transition"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wide">Justifikasi</label>
                            <textarea id="justification" rows="3" required placeholder="Sebab munasabah memohon penyenggaraan..." class="w-full border border-slate-300 rounded-xl p-3 text-xs sm:text-sm outline-none focus:border-orange-500 bg-slate-50 transition"></textarea>
                        </div>
                    </div>

                    <!-- Lampiran Layout -->
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-5">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            
                            <div class="md:col-span-1">
                                <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Gambar Kerosakan</label>
                                <div class="flex gap-2">
                                    <label class="flex-1 bg-orange-50 text-orange-600 border border-orange-200 hover:bg-orange-100 py-2 rounded-lg text-center text-xs font-bold shadow-sm cursor-pointer transition">
                                        <input type="file" id="camera-upload" accept="image/*" capture="environment" multiple class="hidden" onchange="handleFileSelection(event)">
                                        📸 Kamera
                                    </label>
                                    <label class="flex-1 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 py-2 rounded-lg text-center text-xs font-bold shadow-sm cursor-pointer transition">
                                        <input type="file" id="gallery-upload" accept="image/*" multiple class="hidden" onchange="handleFileSelection(event)">
                                        🖼️ Galeri
                                    </label>
                                </div>
                                <div id="file-name-preview" class="flex flex-col gap-1 mt-2"></div>
                            </div>

                            <div class="md:col-span-1">
                                <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Sebutharga (Pilihan)</label>
                                <input type="file" id="quotation-file" accept=".pdf,.doc,.docx,image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-white file:border file:border-slate-300 file:text-slate-700 file:font-semibold hover:file:bg-slate-100 cursor-pointer">
                            </div>
                            
                            <div class="md:col-span-1">
                                <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Anggaran Kos (RM)</label>
                                <input type="number" step="0.01" id="estimated-cost" placeholder="0.00" class="w-full border border-slate-300 rounded-lg p-2 text-xs sm:text-sm outline-none focus:border-orange-500 bg-white transition">
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold text-sm shadow-md transition active:scale-[0.99]"><i class="fa-solid fa-paper-plane mr-1.5"></i> Hantar Permohonan</button>
                </form>
            </div>

            <!-- TAB 2: Rekod Aduan -->
            <div id="tab-records" class="hidden space-y-4">
                <div id="complaints-list" class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                    <div class="p-6 text-center text-slate-400 font-medium border rounded-xl bg-slate-50 md:col-span-2 text-xs">Memuatkan senarai...</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userProfile = null;

        function switchTab(tabId) {
            document.getElementById('tab-form').classList.add('hidden');
            document.getElementById('tab-records').classList.add('hidden');
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            const btnForm = document.getElementById('btn-tab-form');
            const btnRecords = document.getElementById('btn-tab-records');
            
            const activeClass = "flex-1 py-2 text-xs sm:text-sm font-bold text-slate-800 bg-white rounded-lg shadow-sm transition-all";
            const inactiveClass = "flex-1 py-2 text-xs sm:text-sm font-bold text-slate-500 hover:text-slate-800 rounded-lg transition-all";
            
            if (tabId === 'form') {
                btnForm.className = activeClass;
                btnRecords.className = inactiveClass;
            } else {
                btnRecords.className = activeClass;
                btnForm.className = inactiveClass;
                loadMyComplaints(); 
            }
        }

        async function checkAuth() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session) { window.location.href = 'login.html'; return; }
                currentUser = session.user;
                
                const emailHeader = document.getElementById('user-email-header');
                if(emailHeader) emailHeader.innerText = currentUser.email;

                const fullNameFallback = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email.split('@')[0];
                let { data: profile } = await _supabase.from('user_profiles').select('*').eq('email', currentUser.email).maybeSingle();
                
                if (!profile) {
                    const { data: newProfile } = await _supabase.from('user_profiles').insert([{
                        email: currentUser.email, full_name: fullNameFallback, role: 'PENDING', is_blocked: false
                    }]).select().single();
                    profile = newProfile;
                }
                userProfile = profile;

                if (profile.role === 'PENDING' || profile.role === 'TIADA' || profile.is_blocked) {
                    document.body.innerHTML = `
                        <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center border border-slate-200">
                                <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">⏳</div>
                                <h2 class="text-xl font-bold text-slate-800 mb-2">Menunggu Pengesahan</h2>
                                <p class="text-slate-600 text-xs mb-6 leading-relaxed">Akaun anda telah didaftarkan. Sila tunggu kelulusan daripada Pentadbir.</p>
                                <button onclick="logout()" class="w-full bg-slate-800 hover:bg-slate-900 text-white px-5 py-3 rounded-lg font-bold text-sm shadow transition">Log Keluar</button>
                            </div>
                        </div>`;
                    return;
                }

                updateProfileUI();

                const menuContainer = document.getElementById('dynamic-menu');
                menuContainer.innerHTML = '';
                const roleUpper = profile && profile.role ? profile.role.trim().toUpperCase() : 'STAF';

                if (roleUpper === 'ADMIN') {
                    menuContainer.innerHTML = `<a href="admin.html" class="bg-purple-50 text-purple-700 border border-purple-200 px-2.5 py-1 rounded-md text-[10px] font-bold shadow-sm hover:bg-purple-100 transition"><i class="fa-solid fa-gear mr-1"></i> Admin</a>`;
                } else if (roleUpper === 'CPPP') {
                    menuContainer.innerHTML = `<a href="cppp.html" class="bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-md text-[10px] font-bold shadow-sm hover:bg-blue-100 transition"><i class="fa-solid fa-wrench mr-1"></i> CPPP</a>`;
                } else if (roleUpper === 'KCPPP') {
                    menuContainer.innerHTML = `<a href="kcppp.html" class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-md text-[10px] font-bold shadow-sm hover:bg-emerald-100 transition"><i class="fa-solid fa-sliders mr-1"></i> KCPPP</a>`;
                }
                
                menuContainer.classList.remove('hidden');

                if (!sessionStorage.getItem('sudah_redirect')) {
                    sessionStorage.setItem('sudah_redirect', 'true');
                    if (roleUpper === 'CPPP') { window.location.href = 'cppp.html'; return; } 
                    else if (roleUpper === 'KCPPP') { window.location.href = 'kcppp.html'; return; } 
                    else if (roleUpper === 'ADMIN') { window.location.href = 'admin.html'; return; }
                }

                await loadMasterData();
                loadMyComplaints();
            } catch (error) {
                console.error("Ralat Auth:", error);
            }
        }

        function updateProfileUI() {
            const displayName = userProfile?.full_name || currentUser?.email?.split('@')[0] || 'Pengguna';
            
            const nameEl = document.getElementById('display-name');
            if (nameEl) nameEl.innerText = displayName;
            
            const inputEl = document.getElementById('edit-name-input');
            if (inputEl) inputEl.value = displayName;

            const avatarEl = document.getElementById('user-avatar');
            if (avatarEl) {
                avatarEl.innerHTML = `<span class="uppercase font-bold">${displayName.charAt(0)}</span>`;
            }
        }

        function toggleEditName(show) {
            const viewMode = document.getElementById('name-view-mode');
            const editMode = document.getElementById('name-edit-mode');
            if (viewMode) viewMode.classList.toggle('hidden', show);
            if (editMode) editMode.classList.toggle('hidden', !show);
            if (show) {
                const inputEl = document.getElementById('edit-name-input');
                if (inputEl) inputEl.focus();
            }
        }

        async function saveProfileName() {
            const newName = document.getElementById('edit-name-input').value.trim();
            if (!newName) return;
            const { error } = await _supabase.from('user_profiles').update({ full_name: newName }).eq('email', currentUser.email);
            if (!error) {
                if (userProfile) userProfile.full_name = newName;
                updateProfileUI();
                toggleEditName(false);
            }
        }

        async function loadMasterData() {
            const { data: locations } = await _supabase.from('departments').select('*').order('name');
            const deptSelect = document.getElementById('department');
            if (locations && locations.length > 0) {
                deptSelect.innerHTML = '<option value="">Pilih Lokasi</option>' + locations.map(l => `<option value="${l.name}">${l.name}</option>`).join('');
            }

            const { data: settings } = await _supabase.from('system_settings').select('*');
            let damageTypes = ["Perkakasan", "Perisian", "Rangkaian", "Pencetak", "Lain-lain"];
            
            if (settings) {
                const typesSetting = settings.find(s => s.key === 'damage_types');
                if (typesSetting && typesSetting.value) damageTypes = JSON.parse(typesSetting.value);
            }

            document.getElementById('damage-types-container').innerHTML = damageTypes.map(type => `
                <label class="flex items-center gap-2 cursor-pointer p-2 bg-white rounded-lg border border-slate-200 shadow-sm hover:border-orange-300 transition">
                    <input type="checkbox" name="damage_types" value="${type}" class="w-3.5 h-3.5 text-orange-500 rounded">
                    <span class="text-xs font-bold text-slate-700 truncate">${type}</span>
                </label>
            `).join('');
        }

        let selectedAttachmentFiles = [];
        function handleFileSelection(event) {
            const files = event.target.files;
            if (files) Array.from(files).forEach(file => selectedAttachmentFiles.push(file));
            renderFilePreview();
            event.target.value = ''; 
        }

        function renderFilePreview() {
            const preview = document.getElementById('file-name-preview');
            preview.innerHTML = '';
            selectedAttachmentFiles.forEach((file, index) => {
                preview.innerHTML += `
                    <div class="flex items-center justify-between bg-orange-50 px-2 py-1 rounded text-xs border border-orange-100">
                        <span class="truncate text-orange-700 font-bold">📄 ${file.name}</span>
                        <button type="button" onclick="removeFile(${index})" class="text-red-500 hover:text-red-700 bg-red-100 rounded px-1.5 font-bold transition">&times;</button>
                    </div>`;
            });
        }

        function removeFile(index) {
            selectedAttachmentFiles.splice(index, 1);
            renderFilePreview();
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); 
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width; 
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, img.width, img.height);
                        const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                        canvas.toBlob(blob => {
                            resolve(new File([blob], file.name, { type: mimeType }));
                        }, mimeType, 0.8);
                    };
                };
            });
        }

        async function submitComplaint(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = 'Memproses...';
            
            try {
                const selectedDamageTypes = Array.from(document.querySelectorAll('input[name="damage_types"]:checked')).map(cb => cb.value);
                if (selectedDamageTypes.length === 0) { alert('Sila pilih kategori kerosakan.'); btn.disabled = false; btn.innerText = 'Hantar Permohonan'; return; }
                
                let imageUrls = [];
                if (selectedAttachmentFiles.length > 0) {
                    for (let i = 0; i < selectedAttachmentFiles.length; i++) {
                        const compFile = await compressImage(selectedAttachmentFiles[i]);
                        const path = `images/${Date.now()}_${i}_${compFile.name}`;
                        const { error } = await _supabase.storage.from('complaint_attachments').upload(path, compFile);
                        if (!error) imageUrls.push(_supabase.storage.from('complaint_attachments').getPublicUrl(path).data.publicUrl);
                    }
                }
                const finalImageUrl = imageUrls.length > 0 ? imageUrls.join(',') : null;
                
                const quoteFile = document.getElementById('quotation-file').files[0];
                let quotationUrl = null;
                if (quoteFile) {
                    const path = `quotations/${Date.now()}_${quoteFile.name}`;
                    const { error } = await _supabase.storage.from('complaint_attachments').upload(path, quoteFile);
                    if (!error) quotationUrl = _supabase.storage.from('complaint_attachments').getPublicUrl(path).data.publicUrl;
                }

                const newComplaint = {
                    user_id: currentUser.id, full_name: userProfile.full_name, email: currentUser.email, 
                    phone: document.getElementById('phone').value, department: document.getElementById('department').value, 
                    damage_types: selectedDamageTypes, details: document.getElementById('details').value, 
                    justification: document.getElementById('justification').value,
                    estimated_cost: parseFloat(document.getElementById('estimated-cost').value || 0),
                    image_url: finalImageUrl, quotation_url: quotationUrl, status: 'BARU'
                };

                const { error } = await _supabase.from('complaints').insert([newComplaint]);
                if (error) throw error;
                
                alert('Berjaya dihantar!');
                
                const dept = document.getElementById('department').value;
                const details = document.getElementById('details').value || '-';
                const nama = document.getElementById('display-name').innerText;
                const { data: settingData } = await _supabase.from('system_settings').select('setting_value').eq('setting_key', 'whatsapp_no').single();
                let noAdmin = settingData ? settingData.setting_value.replace(/[^0-9]/g, '') : "60123456789";
                
                const mesejWA = `*ADUAN BARU*\n\n*Nama:* ${nama}\n*Lokasi:* ${dept}\n*Butiran:* ${details}`;
                window.open(`https://wa.me/${noAdmin}?text=${encodeURIComponent(mesejWA)}`, '_blank');
                
                document.getElementById('complaint-form').reset();
                selectedAttachmentFiles = []; renderFilePreview();
                switchTab('records');

            } catch (err) { alert('Ralat: ' + err.message); } 
            finally { btn.disabled = false; btn.innerText = 'Hantar Permohonan'; }
        }

        async function loadMyComplaints() {
            const { data, error } = await _supabase.from('complaints').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            const tbody = document.getElementById('complaints-list');
            if (error || !data || data.length === 0) { 
                tbody.innerHTML = '<div class="p-6 text-center text-slate-400 font-medium border rounded-xl bg-slate-50 md:col-span-2 text-xs">Belum ada aduan.</div>'; return; 
            }
            
            tbody.innerHTML = data.map(item => `
                <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm hover:shadow-md transition">
                    <div class="flex justify-between items-start mb-2.5">
                        <span class="text-[11px] text-slate-400 font-bold"><i class="fa-regular fa-calendar mr-1"></i>${new Date(item.created_at).toLocaleDateString('ms-MY')}</span>
                        ${getStatusBadge(item.status)}
                    </div>
                    <h3 class="font-bold text-sm text-slate-800 mb-1">${Array.isArray(item.damage_types) ? item.damage_types.join(', ') : item.damage_types}</h3>
                    <p class="text-xs text-slate-500 line-clamp-2">${item.details || ''}</p>
                    <div class="mt-3 pt-2.5 border-t border-slate-100 text-[11px] font-bold text-slate-600 uppercase flex items-center">
                        <i class="fa-solid fa-location-dot mr-1.5 text-red-500"></i> ${item.department || '-'}
                    </div>
                </div>
            `).join('');
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'BARU': return '<span class="bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-md text-[10px] font-bold">BARU</span>';
                case 'PROSES': return '<span class="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-md text-[10px] font-bold">PROSES</span>';
                case 'SELESAI': return '<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md text-[10px] font-bold">SELESAI</span>';
                default: return `<span class="bg-slate-100 text-slate-800 border border-slate-200 px-2 py-0.5 rounded-md text-[10px] font-bold">${status || 'BARU'}</span>`;
            }
        }

        async function logout() { await _supabase.auth.signOut(); window.location.href = 'login.html'; }
        
        checkAuth();

        async function loadSystemTheme() {
            const { data } = await _supabase.from('system_settings').select('*').in('setting_key', ['system_logo', 'login_bg']);
            if(data) {
                const logo = data.find(d => d.setting_key === 'system_logo');
                const sysLogoEls = document.querySelectorAll('.sys-logo');
                if(logo && logo.setting_value && sysLogoEls.length > 0) {
                    sysLogoEls.forEach(img => img.src = logo.setting_value);
                }
            }
        }
        loadSystemTheme(); 
    </script>
</body>
</html>
