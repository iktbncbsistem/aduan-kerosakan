<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Penyenggaraan - Lapor Aduan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</head>
<body class="flex justify-center min-h-screen bg-slate-200 sm:p-4">

    <!-- Bekas Utama Skrin Telefon -->
    <div class="w-full max-w-[450px] bg-slate-50 relative overflow-hidden sm:shadow-2xl sm:rounded-[2.5rem] sm:border-[8px] border-slate-800 flex flex-col h-[100dvh] sm:h-[850px]">
        
        <!-- HEADER BERTINDIH (Biru Gelap) -->
        <div class="bg-gradient-to-br from-slate-900 to-blue-900 pt-10 pb-16 px-6 text-white relative flex-shrink-0">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-[11px] text-blue-200 mb-0.5">Selamat datang,</p>
                    <h1 id="user-name-display" class="text-base font-bold leading-tight uppercase truncate max-w-[200px]">Pengguna</h1>
                    <p class="text-[9px] bg-blue-800/50 inline-block px-2 py-0.5 rounded-full mt-1.5 font-medium border border-blue-700/50 tracking-wider">STAF ILKBS</p>
                </div>
                <button onclick="logout()" class="w-8 h-8 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center transition border border-white/20" title="Log Keluar">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>
        </div>

        <!-- KAD UTAMA (-mt-6 untuk tindih header) -->
        <div class="bg-slate-50 -mt-6 rounded-t-3xl flex-1 overflow-y-auto px-5 pt-6 pb-24 relative z-10">
            
            <!-- Menu Kategori Pantas -->
            <h2 class="text-xs font-extrabold text-slate-800 mb-3 tracking-wide">LAPOR KEROSAKAN PANTAS</h2>
            <div class="grid grid-cols-4 gap-2 mb-6" id="quick-categories">
                <button onclick="openFormModal('Perkakasan IT')" class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 hover:border-orange-500 transition active:scale-95">
                    <div class="text-orange-500 text-lg"><i class="fa-solid fa-desktop"></i></div>
                    <span class="text-[8px] font-bold text-slate-600 text-center leading-tight">Perkakasan<br>IT</span>
                </button>
                <button onclick="openFormModal('Perisian & Sistem')" class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 hover:border-blue-500 transition active:scale-95">
                    <div class="text-blue-500 text-lg"><i class="fa-solid fa-code"></i></div>
                    <span class="text-[8px] font-bold text-slate-600 text-center leading-tight">Sistem &<br>Perisian</span>
                </button>
                <button onclick="openFormModal('Elektrik')" class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 hover:border-emerald-500 transition active:scale-95">
                    <div class="text-emerald-500 text-lg"><i class="fa-solid fa-plug"></i></div>
                    <span class="text-[8px] font-bold text-slate-600 text-center leading-tight">Elektrik &<br>Wayar</span>
                </button>
                <button onclick="openFormModal('Sivil & Bangunan')" class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 hover:border-amber-500 transition active:scale-95">
                    <div class="text-amber-500 text-lg"><i class="fa-solid fa-house-crack"></i></div>
                    <span class="text-[8px] font-bold text-slate-600 text-center leading-tight">Sivil &<br>Bangunan</span>
                </button>
            </div>

            <!-- Senarai Aduan Terkini -->
            <div class="flex justify-between items-end mb-3 border-b border-slate-200 pb-2">
                <h2 class="text-xs font-extrabold text-slate-800 tracking-wide">STATUS ADUAN SAYA</h2>
                <span class="text-[9px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded font-bold" id="total-aduan">0 Rekod</span>
            </div>
            
            <div id="my-complaints-list" class="space-y-3 pb-4">
                <!-- Senarai dijana oleh JS -->
                <div class="text-center p-6 text-slate-400 text-xs font-medium bg-white rounded-xl border border-slate-100">Memuatkan data aduan...</div>
            </div>
        </div>

        <!-- BOTTOM NAV BAR DENGAN BUTANG TERAPUNG -->
        <div class="absolute bottom-0 w-full bg-slate-900 text-slate-400 rounded-t-3xl pt-2 pb-6 px-6 z-40 flex justify-between items-center shadow-[0_-10px_20px_rgba(0,0,0,0.1)] flex-shrink-0">
            <button onclick="closeFormModal()" class="flex flex-col items-center gap-1 text-white transition"><i class="fa-solid fa-house text-lg"></i><span class="text-[9px] font-bold">Utama</span></button>
            <button class="flex flex-col items-center gap-1 hover:text-white transition mr-4 opacity-50 cursor-not-allowed"><i class="fa-solid fa-clock-rotate-left text-lg"></i><span class="text-[9px] font-bold">Sejarah</span></button>
            
            <!-- Butang Terapung (Lapor) -->
            <button onclick="openFormModal('')" class="absolute left-1/2 -translate-x-1/2 -top-6 w-16 h-16 bg-red-600 text-white rounded-full flex flex-col items-center justify-center shadow-lg border-4 border-slate-50 hover:bg-red-700 hover:scale-105 transition-transform">
                <i class="fa-solid fa-qrcode text-xl mb-0.5"></i>
                <span class="text-[8px] font-bold tracking-widest">LAPOR</span>
            </button>

            <button class="flex flex-col items-center gap-1 hover:text-white transition ml-4 opacity-50 cursor-not-allowed"><i class="fa-solid fa-bell text-lg"></i><span class="text-[9px] font-bold">Notis</span></button>
            <button onclick="logout()" class="flex flex-col items-center gap-1 hover:text-white transition"><i class="fa-solid fa-user text-lg"></i><span class="text-[9px] font-bold">Profil</span></button>
        </div>

        <!-- MODAL BORANG ADUAN (Meluncur dari bawah) -->
        <div id="form-modal" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex flex-col justify-end sm:absolute sm:inset-0 backdrop-blur-sm">
            <div class="bg-white rounded-t-3xl h-[85%] w-full flex flex-col shadow-2xl slide-up relative">
                
                <div class="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50 rounded-t-3xl">
                    <h3 class="font-extrabold text-sm text-slate-800 tracking-tight"><i class="fa-solid fa-file-pen text-red-500 mr-1.5"></i> Borang Aduan Baru</h3>
                    <button onclick="closeFormModal()" class="w-7 h-7 bg-slate-200 hover:bg-red-100 text-slate-600 hover:text-red-600 rounded-full flex items-center justify-center font-bold transition">&times;</button>
                </div>
                
                <div class="p-5 overflow-y-auto flex-1 bg-white">
                    <form id="complaint-form" onsubmit="submitComplaint(event)" class="space-y-4 text-xs">
                        <input type="hidden" id="f-name">
                        <input type="hidden" id="f-phone">
                        
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Lokasi / Jabatan Kerosakan</label>
                            <select id="f-dept" required class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition bg-slate-50">
                                <option value="">-- Pilih Lokasi --</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Kategori Kerosakan</label>
                            <select id="f-category" required class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition bg-slate-50">
                                <option value="">-- Pilih Kategori --</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Butiran Kerosakan</label>
                            <textarea id="f-details" required rows="3" placeholder="Terangkan kerosakan secara terperinci..." class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition bg-slate-50"></textarea>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Muat Naik Gambar (Pilihan)</label>
                            <div class="relative border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-red-500 hover:bg-red-50 transition cursor-pointer">
                                <input type="file" id="f-image" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                <i class="fa-solid fa-cloud-arrow-up text-xl text-slate-400 mb-1"></i>
                                <p class="text-[10px] font-bold text-slate-600" id="file-name-display">Klik untuk pilih gambar</p>
                            </div>
                        </div>

                        <div class="pt-2 pb-4">
                            <button type="submit" id="submit-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-red-600/30 transition text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i> Hantar Aduan
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null; let userProfile = null;

        async function initIndex() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            currentUser = session.user;
            
            const { data: profile } = await _supabase.from('user_profiles').select('*').eq('email', currentUser.email).single();
            if(profile) {
                userProfile = profile;
                document.getElementById('user-name-display').innerText = profile.full_name || currentUser.email.split('@')[0];
                document.getElementById('f-name').value = profile.full_name || '';
                document.getElementById('f-phone').value = profile.phone || '';
            }

            loadMasterData();
            loadMyComplaints();
        }

        async function loadMasterData() {
            const { data: locations } = await _supabase.from('departments').select('*').order('name');
            if (locations) document.getElementById('f-dept').innerHTML = '<option value="">-- Pilih Lokasi --</option>' + locations.map(l => `<option value="${l.name}">${l.name}</option>`).join('');

            const { data: settings } = await _supabase.from('system_settings').select('*');
            if (settings) {
                const typesSetting = settings.find(s => s.key === 'damage_types');
                if (typesSetting && typesSetting.value) {
                    const types = JSON.parse(typesSetting.value);
                    document.getElementById('f-category').innerHTML = '<option value="">-- Pilih Kategori --</option>' + types.map(t => `<option value="${t}">${t}</option>`).join('');
                }
            }
        }

        async function loadMyComplaints() {
            const { data, error } = await _supabase.from('complaints').select('*').eq('email', currentUser.email).order('created_at', { ascending: false }).limit(10);
            const container = document.getElementById('my-complaints-list');
            
            if (error || !data || data.length === 0) {
                document.getElementById('total-aduan').innerText = '0 Rekod';
                container.innerHTML = '<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center"><div class="w-12 h-12 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center text-xl mx-auto mb-2"><i class="fa-solid fa-folder-open"></i></div><p class="text-xs text-slate-500 font-medium">Tiada rekod aduan buat masa ini.</p></div>';
                return;
            }

            document.getElementById('total-aduan').innerText = `${data.length} Rekod`;
            container.innerHTML = data.map(item => {
                let icon = 'fa-file-lines'; let color = 'text-slate-600 bg-slate-50';
                if(item.damage_types && item.damage_types.includes('Elektrik')) { icon = 'fa-plug'; color = 'text-emerald-600 bg-emerald-50'; }
                else if(item.damage_types && item.damage_types.includes('Perisian')) { icon = 'fa-code'; color = 'text-blue-600 bg-blue-50'; }
                else if(item.damage_types && item.damage_types.includes('Perkakasan')) { icon = 'fa-desktop'; color = 'text-orange-600 bg-orange-50'; }
                else if(item.damage_types && item.damage_types.includes('Sivil')) { icon = 'fa-house-crack'; color = 'text-amber-600 bg-amber-50'; }

                return `
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex gap-3 items-center">
                    <div class="w-10 h-10 rounded-xl ${color} flex items-center justify-center text-lg flex-shrink-0"><i class="fa-solid ${icon}"></i></div>
                    <div class="flex-1 overflow-hidden">
                        <h3 class="text-[11px] font-bold text-slate-800 truncate">${item.damage_types || 'Aduan Kerosakan'}</h3>
                        <p class="text-[9px] text-slate-500 truncate">${item.department} • ${new Date(item.created_at).toLocaleDateString('ms-MY')}</p>
                    </div>
                    <div class="flex-shrink-0">${getStatusBadgeMobile(item.status)}</div>
                </div>`;
            }).join('');
        }

        function getStatusBadgeMobile(status) {
            switch(status) {
                case 'BARU': return '<span class="bg-amber-100 text-amber-700 px-2 py-1 rounded-lg text-[8px] font-bold uppercase">BARU</span>';
                case 'PROSES': case 'SEDANG DIPROSES': return '<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-lg text-[8px] font-bold uppercase">PROSES</span>';
                case 'SELESAI': return '<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded-lg text-[8px] font-bold uppercase">SELESAI</span>';
                default: return `<span class="bg-slate-100 text-slate-600 px-2 py-1 rounded-lg text-[8px] font-bold uppercase">${status}</span>`;
            }
        }

        // Papar nama file bila gambar dipilih
        document.getElementById('f-image').addEventListener('change', function(e) {
            const label = document.getElementById('file-name-display');
            if(e.target.files.length > 0) label.innerHTML = `<span class="text-red-600"><i class="fa-solid fa-check mr-1"></i> ${e.target.files[0].name}</span>`;
            else label.innerText = 'Klik untuk pilih gambar';
        });

        function openFormModal(categoryStr) {
            document.getElementById('form-modal').classList.remove('hidden');
            if(categoryStr) {
                const select = document.getElementById('f-category');
                for(let i=0; i<select.options.length; i++) {
                    if(select.options[i].value.includes(categoryStr) || categoryStr.includes(select.options[i].value)) {
                        select.selectedIndex = i; break;
                    }
                }
            }
        }
        function closeFormModal() { document.getElementById('form-modal').classList.add('hidden'); document.getElementById('complaint-form').reset(); document.getElementById('file-name-display').innerText = 'Klik untuk pilih gambar'; }

        async function submitComplaint(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn'); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghantar...';

            let imageUrl = null; const fileInput = document.getElementById('f-image');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0]; const fileExt = file.name.split('.').pop(); const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
                const { data: uploadData, error: uploadError } = await _supabase.storage.from('complaint-files').upload(fileName, file);
                if (uploadError) { alert('Gagal muat naik gambar.'); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Hantar Aduan'; return; }
                imageUrl = _supabase.storage.from('complaint-files').getPublicUrl(fileName).data.publicUrl;
            }

            const { error } = await _supabase.from('complaints').insert([{
                email: currentUser.email,
                full_name: document.getElementById('f-name').value || currentUser.email,
                phone: document.getElementById('f-phone').value || '-',
                department: document.getElementById('f-dept').value,
                damage_types: document.getElementById('f-category').value,
                details: document.getElementById('f-details').value,
                image_url: imageUrl,
                status: 'BARU'
            }]);

            if (error) { alert('Ralat menghantar aduan: ' + error.message); } 
            else { alert('Aduan berjaya dihantar!'); closeFormModal(); loadMyComplaints(); }
            
            btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Hantar Aduan';
        }

        async function logout() { sessionStorage.clear(); await _supabase.auth.signOut(); window.location.href = 'login.html'; }
        
        initIndex();
    </script>
</body>
</html>
