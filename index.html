<html lang="ms">

            <div class="flex items-center gap-3 sm:gap-4">

        <div class="p-4 sm:p-8">
            <!-- Pill Tabs -->
            <div class="flex bg-gray-100 p-1.5 rounded-lg mb-6 sm:mb-8 max-w-lg mx-auto">
                <button id="btn-tab-form" onclick="switchTab('form')" class="flex-1 py-2 sm:py-2.5 text-[13px] sm:text-sm font-bold text-gray-800 bg-white rounded-md shadow-sm transition-all">

            <!-- TAB 1: Borang Aduan -->

                <form id="complaint-form" onsubmit="submitComplaint(event)">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-blue-50 p-4 sm:p-5 rounded-xl border border-blue-100 mb-4 sm:mb-6">
                        <div>

                            <select id="department" required class="w-full border border-gray-300 rounded-lg p-2.5 sm:p-3 text-sm outline-none focus:border-blue-500 bg-white shadow-sm transition">

                        </div>
                        <div>

                            <div class="md:col-span-1">

                                <div class="flex gap-2">

                                        <input type="file" id="camera-upload" accept="image/*" capture="environment" multiple class="hidden" onchange="handleFileSelection(event)">

                                    <label class="flex-1 bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 py-2.5 rounded-lg text-center text-xs sm:text-sm font-bold shadow-sm cursor-pointer transition">
                                        <input type="file" id="gallery-upload" accept="image/*" multiple class="hidden" onchange="handleFileSelection(event)">

                                </div>

                    <div class="p-6 text-center text-gray-400 font-medium border rounded-lg bg-gray-50 md:col-span-2">Memuatkan senarai...</div>

        <div class="clear-both"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userProfile = null;
        let whatsappSettings = { enabled: false, phone: '' };

        function switchTab(tabId) {
            document.getElementById('tab-form').classList.add('hidden');
            document.getElementById('tab-records').classList.add('hidden');
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            const btnForm = document.getElementById('btn-tab-form');
            const btnRecords = document.getElementById('btn-tab-records');
            
            const activeClass = "flex-1 py-2 sm:py-2.5 text-[13px] sm:text-sm font-bold text-gray-800 bg-white rounded-md shadow-sm transition-all";
            const inactiveClass = "flex-1 py-2 sm:py-2.5 text-[13px] sm:text-sm font-bold text-gray-500 hover:text-gray-800 rounded-md transition-all";
            
            if (tabId === 'form') {
                btnForm.className = activeClass;
                btnRecords.className = inactiveClass;
            } else {
                btnRecords.className = activeClass;
                btnForm.className = inactiveClass;
                loadMyComplaints(); 
            }
        }

        async function checkAuth() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session) { window.location.href = 'login.html'; return; }
                currentUser = session.user;
                
                document.getElementById('user-email-header').innerText = currentUser.email;

                const fullNameFallback = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email.split('@')[0];
                let { data: profile } = await _supabase.from('user_profiles').select('*').eq('email', currentUser.email).maybeSingle();
                
                if (!profile) {
                    const { data: newProfile } = await _supabase.from('user_profiles').insert([{
                        email: currentUser.email, full_name: fullNameFallback, role: 'PENDING', is_blocked: false
                    }]).select().single();
                    profile = newProfile;
                }
                userProfile = profile;

                if (profile.role === 'PENDING' || profile.role === 'TIADA' || profile.is_blocked) {
                    document.body.innerHTML = `
                        <div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
                            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center border border-gray-200">
                                <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">⏳</div>
                                <h2 class="text-xl font-bold text-gray-800 mb-2">Menunggu Pengesahan</h2>
                                <p class="text-gray-600 text-xs mb-6 leading-relaxed">Akaun anda telah didaftarkan. Sila tunggu kelulusan daripada Pentadbir.</p>
                                <button onclick="logout()" class="w-full bg-gray-800 hover:bg-gray-900 text-white px-5 py-3 rounded-lg font-bold text-sm shadow transition">Log Keluar</button>
                            </div>
                        </div>`;
                    return;
                }

                updateProfileUI();

                const menuContainer = document.getElementById('dynamic-menu');
                menuContainer.innerHTML = '';
                const roleUpper = profile && profile.role ? profile.role.trim().toUpperCase() : 'STAF';

                if (roleUpper === 'ADMIN') {
                    menuContainer.innerHTML = `<a href="admin.html" class="bg-purple-100 text-purple-700 px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold shadow-sm hover:bg-purple-200 transition">⚙️ Admin</a>`;
                } else if (roleUpper === 'CPPP') {
                    menuContainer.innerHTML = `<a href="cppp.html" class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold shadow-sm hover:bg-blue-200 transition">🔧 CPPP</a>`;
                } else if (roleUpper === 'KCPPP') {
                    menuContainer.innerHTML = `<a href="kcppp.html" class="bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold shadow-sm hover:bg-emerald-200 transition">✅ KCPPP</a>`;
                }
                
                menuContainer.classList.remove('hidden');

                if (!sessionStorage.getItem('sudah_redirect')) {
                    sessionStorage.setItem('sudah_redirect', 'true');
                    if (roleUpper === 'CPPP') { window.location.href = 'cppp.html'; return; } 
                    else if (roleUpper === 'KCPPP') { window.location.href = 'kcppp.html'; return; } 
                    else if (roleUpper === 'ADMIN') { window.location.href = 'admin.html'; return; }
                }

                await loadMasterData();
                loadMyComplaints();
            } catch (error) {
                console.error("Ralat Auth:", error);
                alert("Ralat sistem. Sila muat semula halaman.");

        }

        function updateProfileUI() {
            const displayName = userProfile.full_name || currentUser.email.split('@')[0];
            document.getElementById('display-name').innerText = displayName;
            document.getElementById('edit-name-input').value = displayName;
            
            const avatarImg = document.getElementById('profile-avatar');
            if (userProfile.avatar_url) avatarImg.src = userProfile.avatar_url;
            else avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=0D8ABC&color=fff&size=128&bold=true`;
        }

        function toggleEditName(show) {
            document.getElementById('name-view-mode').classList.toggle('hidden', show);
            document.getElementById('name-edit-mode').classList.toggle('hidden', !show);
            if (show) document.getElementById('edit-name-input').focus();
        }

        async function saveProfileName() {
            const newName = document.getElementById('edit-name-input').value.trim();
            if (!newName) return;
            const { error } = await _supabase.from('user_profiles').update({ full_name: newName }).eq('email', currentUser.email);
            if (!error) {
                userProfile.full_name = newName;
                updateProfileUI();
                toggleEditName(false);
            }
        }

        async function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('profile-avatar').style.opacity = '0.5';
            try {
                const compressedImage = await compressImage(file, 400); 
                const filePath = `avatars/${currentUser.id}_${Date.now()}.jpg`;
                const { error: uploadError } = await _supabase.storage.from('complaint_attachments').upload(filePath, compressedImage, { upsert: true });
                if (uploadError) throw uploadError;
                const publicUrl = _supabase.storage.from('complaint_attachments').getPublicUrl(filePath).data.publicUrl;
                const { error: updateError } = await _supabase.from('user_profiles').update({ avatar_url: publicUrl }).eq('email', currentUser.email);
                if (updateError) throw updateError;
                userProfile.avatar_url = publicUrl;
                updateProfileUI();
            } catch (err) {
                alert("Ralat muat naik gambar.");
            } finally {
                document.getElementById('profile-avatar').style.opacity = '1';
                event.target.value = '';
            }
        }

        async function loadMasterData() {
            // TALLY LOKASI: Mengambil data dari jadual 'departments'
            const { data: locations } = await _supabase.from('departments').select('*').order('name');
            const deptSelect = document.getElementById('department');
            if (locations && locations.length > 0) {
                deptSelect.innerHTML = '<option value="">Pilih Lokasi</option>' + locations.map(l => `<option value="${l.name}">${l.name}</option>`).join('');
            }

            const { data: settings } = await _supabase.from('system_settings').select('*');
            let damageTypes = ["Perkakasan", "Perisian", "Rangkaian", "Pencetak", "Lain-lain"];
            
            if (settings) {
                const typesSetting = settings.find(s => s.key === 'damage_types');
                if (typesSetting && typesSetting.value) damageTypes = JSON.parse(typesSetting.value);
            }

            document.getElementById('damage-types-container').innerHTML = damageTypes.map(type => `
                <label class="flex items-center gap-2 cursor-pointer p-2 bg-white rounded-lg border border-gray-200 shadow-sm hover:border-blue-300 transition">
                    <input type="checkbox" name="damage_types" value="${type}" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-xs sm:text-sm font-bold text-gray-700 truncate">${type}</span>
                </label>
            `).join('');
        }

        let selectedAttachmentFiles = [];
        function handleFileSelection(event) {
            const files = event.target.files;
            if (files) Array.from(files).forEach(file => selectedAttachmentFiles.push(file));
            renderFilePreview();
            event.target.value = ''; 
        }

        function renderFilePreview() {
            const preview = document.getElementById('file-name-preview');
            preview.innerHTML = '';
            selectedAttachmentFiles.forEach((file, index) => {
                preview.innerHTML += `
                    <div class="flex items-center justify-between bg-blue-50 px-2 py-1.5 rounded-lg text-xs border border-blue-100">
                        <span class="truncate text-blue-700 font-bold">📄 ${file.name}</span>
                        <button type="button" onclick="removeFile(${index})" class="text-red-500 hover:text-red-700 bg-red-100 rounded px-2 font-bold transition">&times;</button>
                    </div>`;
            });
        }

        function removeFile(index) {
            selectedAttachmentFiles.splice(index, 1);
            renderFilePreview();
        }

function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader(); 
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); 
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width; 
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        
                        // Bersihkan canvas supaya kekal lutsinar
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, img.width, img.height);
                        
                        // Semak format asal fail
                        const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                        
                        canvas.toBlob(blob => {
                            resolve(new File([blob], file.name, { type: mimeType }));
                        }, mimeType, 0.8);
                    };
                };
            });
        }

        async function submitComplaint(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = 'Memproses...';
            
            try {
                const selectedDamageTypes = Array.from(document.querySelectorAll('input[name="damage_types"]:checked')).map(cb => cb.value);
                if (selectedDamageTypes.length === 0) { alert('Sila pilih kategori kerosakan.'); btn.disabled = false; btn.innerText = 'Hantar Permohonan'; return; }
                
                let imageUrls = [];
                if (selectedAttachmentFiles.length > 0) {
                    for (let i = 0; i < selectedAttachmentFiles.length; i++) {
                        const compFile = await compressImage(selectedAttachmentFiles[i]);
                        const path = `images/${Date.now()}_${i}_${compFile.name}`;
                        const { error } = await _supabase.storage.from('complaint_attachments').upload(path, compFile);
                        if (!error) imageUrls.push(_supabase.storage.from('complaint_attachments').getPublicUrl(path).data.publicUrl);
                    }
                }
                const finalImageUrl = imageUrls.length > 0 ? imageUrls.join(',') : null;
                
                const quoteFile = document.getElementById('quotation-file').files[0];
                let quotationUrl = null;
                if (quoteFile) {
                    const path = `quotations/${Date.now()}_${quoteFile.name}`;
                    const { error } = await _supabase.storage.from('complaint_attachments').upload(path, quoteFile);
                    if (!error) quotationUrl = _supabase.storage.from('complaint_attachments').getPublicUrl(path).data.publicUrl;
                }

                const newComplaint = {
                    user_id: currentUser.id, full_name: userProfile.full_name, email: currentUser.email, 
                    phone: document.getElementById('phone').value, department: document.getElementById('department').value, 
                    damage_types: selectedDamageTypes, details: document.getElementById('details').value, 
                    justification: document.getElementById('justification').value,
                    estimated_cost: parseFloat(document.getElementById('estimated-cost').value || 0),
                    image_url: finalImageUrl, quotation_url: quotationUrl, status: 'BARU'
                };

                const { error } = await _supabase.from('complaints').insert([newComplaint]);
                if (error) throw error;
                
                alert('Berjaya dihantar!');
                
                const dept = document.getElementById('department').value;
                const details = document.getElementById('details').value || '-';
                const nama = document.getElementById('display-name').innerText;
                const { data: settingData } = await _supabase.from('system_settings').select('setting_value').eq('setting_key', 'whatsapp_no').single();
                let noAdmin = settingData ? settingData.setting_value.replace(/[^0-9]/g, '') : "60123456789";
                
                const mesejWA = `*ADUAN BARU*\n\n*Nama:* ${nama}\n*Lokasi:* ${dept}\n*Butiran:* ${details}`;
                window.open(`https://wa.me/${noAdmin}?text=${encodeURIComponent(mesejWA)}`, '_blank');
                
                document.getElementById('complaint-form').reset();
                selectedAttachmentFiles = []; renderFilePreview();
                switchTab('records');

            } catch (err) { alert('Ralat: ' + err.message); } 
            finally { btn.disabled = false; btn.innerText = 'Hantar Permohonan'; }
        }

        async function loadMyComplaints() {
            const { data, error } = await _supabase.from('complaints').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            const tbody = document.getElementById('complaints-list');
            if (error || !data || data.length === 0) { 
                tbody.innerHTML = '<div class="p-6 text-center text-gray-400 font-medium border rounded-lg bg-gray-50 md:col-span-2">Belum ada aduan.</div>'; return; 
            }
            
            tbody.innerHTML = data.map(item => `
                <div class="bg-white border border-gray-200 p-4 sm:p-5 rounded-xl shadow-sm hover:shadow-md transition">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[11px] sm:text-xs text-gray-400 font-bold"><i class="fa-regular fa-calendar mr-1"></i>${new Date(item.created_at).toLocaleDateString('ms-MY')}</span>
                        ${getStatusBadge(item.status)}
                    </div>
                    <h3 class="font-bold text-sm sm:text-base text-gray-800 mb-1">${Array.isArray(item.damage_types) ? item.damage_types.join(', ') : item.damage_types}</h3>
                    <p class="text-xs sm:text-sm text-gray-500 line-clamp-2">${item.details || ''}</p>
                    <div class="mt-4 pt-3 border-t border-gray-100 text-[11px] sm:text-xs font-bold text-gray-600 uppercase flex items-center">
                        <i class="fa-solid fa-location-dot mr-1.5 text-red-500"></i> ${item.department || '-'}
                    </div>
                </div>
            `).join('');
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'BARU': return '<span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-md text-[10px] sm:text-xs font-bold shadow-sm">BARU</span>';
                case 'PROSES': return '<span class="bg-blue-100 text-blue-800 px-2.5 py-1 rounded-md text-[10px] sm:text-xs font-bold shadow-sm">PROSES</span>';
                case 'SELESAI': return '<span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-md text-[10px] sm:text-xs font-bold shadow-sm">SELESAI</span>';
                default: return `<span class="bg-gray-100 text-gray-800 px-2.5 py-1 rounded-md text-[10px] sm:text-xs font-bold shadow-sm">${status || 'BARU'}</span>`;
            }
        }

        async function logout() { await _supabase.auth.signOut(); window.location.href = 'login.html'; }
        
        checkAuth();

        async function loadSystemTheme() {
            const { data } = await _supabase.from('system_settings').select('*').in('setting_key', ['system_logo', 'login_bg']);
            if(data) {
                const logo = data.find(d => d.setting_key === 'system_logo');
                const sysLogoEls = document.querySelectorAll('.sys-logo');
                if(logo && logo.setting_value && sysLogoEls.length > 0) {
                    sysLogoEls.forEach(img => img.src = logo.setting_value);
                }
                
                const bg = data.find(d => d.setting_key === 'login_bg');
                if(bg && bg.setting_value && document.body.classList.contains('sys-bg')) {
                    document.body.style.backgroundImage = `url('${bg.setting_value}')`;
                }
            }
        }
        loadSystemTheme(); 
        
    </script>
</body>
</html>
