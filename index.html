<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Staf - Sistem Pengurusan IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header / Navibar -->
    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
        <div>
            <h1 class="font-bold text-xl">Sistem Pengurusan IT</h1>
            <p class="text-xs text-blue-200">Portal Aduan Kerosakan IKTBN</p>
        </div>
        <div class="flex items-center gap-4">
            <span id="user-email-header" class="text-sm font-medium bg-blue-800 px-3 py-1 rounded">Memuatkan...</span>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">Log Keluar</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Borang Aduan Kerosakan Baharu -->
        <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-5">
            <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">Hantar Aduan Baharu</h2>
            
            <form id="complaint-form" onsubmit="submitComplaint(event)">
                
                <!-- Profil Pemohon (Boleh Edit) -->
                <div class="mb-5 flex items-center gap-4 bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <!-- Avatar / Gambar Profil -->
                    <div class="relative group cursor-pointer flex-shrink-0" onclick="document.getElementById('avatar-upload').click()" title="Klik untuk tukar gambar profil">
                        <img id="profile-avatar" src="https://ui-avatars.com/api/?name=U&background=0D8ABC&color=fff" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-md">
                        <div class="absolute inset-0 bg-black bg-opacity-50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-200">
                            <span class="text-white text-[10px] font-bold">Tukar</span>
                        </div>
                        <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
                    </div>
                    
                    <!-- Nama Pemohon -->
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-blue-800 uppercase mb-1">Nama Pemohon</label>
                        
                        <!-- Paparan Biasa -->
                        <div id="name-view-mode" class="flex items-center gap-2">
                            <span id="display-name" class="font-bold text-gray-800 text-base break-all">Memuatkan...</span>
                            <button type="button" onclick="toggleEditName(true)" class="text-blue-600 hover:text-blue-800 text-[10px] bg-blue-100 hover:bg-blue-200 px-2 py-1 rounded transition whitespace-nowrap">✏️ Edit</button>
                        </div>
                        
                        <!-- Mod Edit -->
                        <div id="name-edit-mode" class="hidden flex items-center gap-2 mt-1">
                            <input type="text" id="edit-name-input" placeholder="Nama Penuh" class="border rounded px-2 py-1.5 text-sm font-semibold text-gray-800 focus:ring-2 focus:ring-blue-500 outline-none w-full max-w-[200px]">
                            <button type="button" onclick="saveProfileName()" class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-1.5 rounded font-bold shadow">Simpan</button>
                            <button type="button" onclick="toggleEditName(false)" class="text-gray-500 hover:text-gray-700 text-xs px-1 font-bold">Batal</button>
                        </div>
                    </div>
                </div>

                <!-- No Telefon & Jabatan -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">No. Telefon <span class="text-red-500">*</span></label>
                        <input type="tel" id="phone" required placeholder="Cth: 0123456789" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Jabatan / Lokasi <span class="text-red-500">*</span></label>
                        <select id="department" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">Pilih Jabatan</option>
                        </select>
                    </div>
                </div>

                <!-- Jenis Kerosakan (Checkbox Dynamic) -->
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Jenis Kerosakan <span class="text-red-500">*</span></label>
                    <div id="damage-types-container" class="grid grid-cols-2 gap-2 bg-gray-50 p-3 rounded border text-sm max-h-36 overflow-y-auto">
                        <span class="text-xs text-gray-400 col-span-2">Memuatkan jenis kerosakan...</span>
                    </div>
                </div>

                <!-- Butiran Kerosakan -->
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Butiran Kerosakan <span class="text-red-500">*</span></label>
                    <textarea id="details" rows="3" required placeholder="Terangkan kerosakan secara terperinci..." class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <!-- Justifikasi Keperluan (Kotak Besar) -->
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Justifikasi Keperluan Penyenggaraan <span class="text-red-500">*</span></label>
                    <textarea id="justification" rows="3" required placeholder="Sebab mendesak penyenggaraan perlu dijalankan secepat mungkin..." class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <!-- Muat Naik Gambar & Sebutharga -->
                <div class="grid grid-cols-1 gap-3 mb-5">
                    <div>
                        <label class="block text-sm font-medium mb-1">Gambar Kerosakan (Kamera / Upload)</label>
                        <input type="file" id="image-file" accept="image/*" capture="environment" class="w-full border rounded p-1.5 text-xs text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium mb-1">Kos Anggaran (RM)</label>
                            <input type="number" step="0.01" id="estimated-cost" placeholder="0.00" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Upload Sebutharga</label>
                            <input type="file" id="quotation-file" accept=".pdf,.doc,.docx,image/*" class="w-full border rounded p-1.5 text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-gray-100 file:text-gray-700">
                        </div>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-bold text-sm shadow transition">Hantar Aduan</button>
            </form>
        </div>

        <!-- Senarai Rekod Aduan Saya -->
        <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-7">
            <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">Rekod Aduan Saya</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 border-b text-gray-600">
                        <tr>
                            <th class="p-3">Kerosakan</th>
                            <th class="p-3">Jabatan</th>
                            <th class="p-3">Tarikh</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="complaints-list">
                        <tr><td colspan="4" class="p-4 text-center text-gray-400">Memuatkan senarai aduan...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userProfile = null;
        let whatsappSettings = { enabled: false, phone: '' };

        async function checkAuth() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session) { window.location.href = 'login.html'; return; }
                currentUser = session.user;
                
                document.getElementById('user-email-header').innerText = currentUser.email;

                const fullNameFallback = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email.split('@')[0];

                let { data: profile } = await _supabase.from('user_profiles').select('*').eq('email', currentUser.email).maybeSingle();
                
                if (!profile) {
                    const { data: newProfile } = await _supabase.from('user_profiles').insert([{
                        email: currentUser.email, full_name: fullNameFallback, role: 'PENDING', is_blocked: false
                    }]).select().single();
                    profile = newProfile;
                }
                userProfile = profile;

                if (profile.role === 'PENDING' || profile.role === 'TIADA' || profile.is_blocked) {
                    document.body.innerHTML = `
                        <div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
                            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border">
                                <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">⚠️</div>
                                <h2 class="text-xl font-bold text-gray-800 mb-2">Akaun Menunggu Pengesahan</h2>
                                <p class="text-gray-600 text-sm mb-6 leading-relaxed">Akaun anda (<span class="font-semibold text-gray-800">${currentUser.email}</span>) telah direkodkan. Sila tunggu kelulusan akses daripada Pentadbir Sistem sebelum menggunakan sistem ini.</p>
                                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg font-semibold text-sm shadow">Log Keluar</button>
                            </div>
                        </div>`;
                    return;
                }

                // Setup Profil UI (Nama & Avatar)
                updateProfileUI();

                await loadMasterData();
                loadMyComplaints();
            } catch (error) {
                console.error("Ralat Auth:", error);
                alert("Berlaku ralat sistem. Sila muat semula (refresh) halaman.");
            }
        }

        // ================= KEMASKINI PROFIL & GAMBAR =================
        function updateProfileUI() {
            const displayName = userProfile.full_name || currentUser.email.split('@')[0];
            document.getElementById('display-name').innerText = displayName;
            document.getElementById('edit-name-input').value = displayName;
            
            const avatarImg = document.getElementById('profile-avatar');
            if (userProfile.avatar_url) {
                avatarImg.src = userProfile.avatar_url;
            } else {
                avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=0D8ABC&color=fff&size=128`;
            }
        }

        function toggleEditName(show) {
            document.getElementById('name-view-mode').classList.toggle('hidden', show);
            document.getElementById('name-edit-mode').classList.toggle('hidden', !show);
            if (show) document.getElementById('edit-name-input').focus();
        }

        async function saveProfileName() {
            const newName = document.getElementById('edit-name-input').value.trim();
            if (!newName) { alert("Nama tidak boleh dibiarkan kosong."); return; }
            
            const btn = document.querySelector('#name-edit-mode button');
            btn.innerText = 'Menyimpan...'; btn.disabled = true;

            const { error } = await _supabase.from('user_profiles').update({ full_name: newName }).eq('email', currentUser.email);
            
            if (!error) {
                userProfile.full_name = newName;
                updateProfileUI();
                toggleEditName(false);
            } else {
                alert("Gagal mengemaskini nama: " + error.message);
            }
            btn.innerText = 'Simpan'; btn.disabled = false;
        }

        async function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('profile-avatar').style.opacity = '0.5';

            try {
                const compressedImage = await compressImage(file, 400); // 400px cukup untuk avatar
                const filePath = `avatars/${currentUser.id}_${Date.now()}.jpg`;
                
                const { error: uploadError } = await _supabase.storage.from('complaint_attachments').upload(filePath, compressedImage, { upsert: true });
                if (uploadError) throw uploadError;

                const publicUrl = _supabase.storage.from('complaint_attachments').getPublicUrl(filePath).data.publicUrl;
                
                const { error: updateError } = await _supabase.from('user_profiles').update({ avatar_url: publicUrl }).eq('email', currentUser.email);
                if (updateError) throw updateError;

                userProfile.avatar_url = publicUrl;
                updateProfileUI();
            } catch (err) {
                alert("Gagal memuat naik gambar profil: " + err.message);
            } finally {
                document.getElementById('profile-avatar').style.opacity = '1';
                event.target.value = ''; // Reset input
            }
        }

        // ================= FUNGSI UTAMA (ADUAN) =================
        async function loadMasterData() {
            const { data: locations } = await _supabase.from('locations').select('*');
            const deptSelect = document.getElementById('department');
            if (locations && locations.length > 0) {
                deptSelect.innerHTML = '<option value="">Pilih Jabatan</option>' + locations.map(l => `<option value="${l.name}">${l.name}</option>`).join('');
            }

            const { data: settings } = await _supabase.from('system_settings').select('*');
            let damageTypes = ["Perkakasan (Hardware)", "Perisian (Software)", "Rangkaian / Wi-Fi", "Pencetak (Printer)", "Lain-lain"];
            
            if (settings) {
                const typesSetting = settings.find(s => s.key === 'damage_types');
                if (typesSetting && typesSetting.value) damageTypes = JSON.parse(typesSetting.value);
                const waEnabled = settings.find(s => s.key === 'whatsapp_enabled');
                const waPhone = settings.find(s => s.key === 'whatsapp_number');
                whatsappSettings.enabled = waEnabled ? waEnabled.value === 'true' : false;
                whatsappSettings.phone = waPhone ? waPhone.value : '';
            }

            document.getElementById('damage-types-container').innerHTML = damageTypes.map(type => `
                <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600">
                    <input type="checkbox" name="damage_types" value="${type}" class="rounded text-blue-600 focus:ring-blue-500">
                    <span>${type}</span>
                </label>
            `).join('');
        }

        // Fungsi Compress yang telah diubahsuai sedikit untuk saiz dinamik
        function compressImage(file, max_size = 1200) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > max_size) { h *= max_size / w; w = max_size; } } 
                        else { if (h > max_size) { w *= max_size / h; h = max_size; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        canvas.toBlob(blob => resolve(new File([blob], file.name, { type: 'image/jpeg' })), 'image/jpeg', 0.8);
                    };
                };
            });
        }

        async function submitComplaint(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = 'Menghantar Aduan...';
            
            try {
                const selectedDamageTypes = Array.from(document.querySelectorAll('input[name="damage_types"]:checked')).map(cb => cb.value);
                if (selectedDamageTypes.length === 0) { alert('Sila pilih sekurang-kurangnya satu Jenis Kerosakan.'); btn.disabled = false; btn.innerText = 'Hantar Aduan'; return; }
                
                let imageUrl = null, quotationUrl = null;
                const imgFile = document.getElementById('image-file').files[0];
                if (imgFile) {
                    const compFile = await compressImage(imgFile);
                    const path = `images/${Date.now()}_${compFile.name}`;
                    const { error } = await _supabase.storage.from('complaint_attachments').upload(path, compFile);
                    if (!error) imageUrl = _supabase.storage.from('complaint_attachments').getPublicUrl(path).data.publicUrl;
                }
                
                const quoteFile = document.getElementById('quotation-file').files[0];
                if (quoteFile) {
                    const path = `quotations/${Date.now()}_${quoteFile.name}`;
                    const { error } = await _supabase.storage.from('complaint_attachments').upload(path, quoteFile);
                    if (!error) quotationUrl = _supabase.storage.from('complaint_attachments').getPublicUrl(path).data.publicUrl;
                }

                // Ambil Nama Pemohon Terkini dari UI
                const currentName = document.getElementById('display-name').innerText;

                const newComplaint = {
                    user_id: currentUser.id, full_name: currentName,
                    email: currentUser.email, phone: document.getElementById('phone').value,
                    department: document.getElementById('department').value, damage_types: selectedDamageTypes,
                    details: document.getElementById('details').value, justification: document.getElementById('justification').value,
                    estimated_cost: parseFloat(document.getElementById('estimated-cost').value || 0),
                    image_url: imageUrl, quotation_url: quotationUrl, status: 'BARU'
                };

                const { error } = await _supabase.from('complaints').insert([newComplaint]);
                if (error) throw error;
                
                alert('Aduan berjaya dihantar!');
                
                if (whatsappSettings.enabled && whatsappSettings.phone) {
                    const msg = `*ADUAN KEROSAKAN BAHARU*%0A*Pemohon:* ${newComplaint.full_name}%0A*Jabatan:* ${newComplaint.department}%0A*Kerosakan:* ${selectedDamageTypes.join(', ')}`;
                    window.open(`https://wa.me/${whatsappSettings.phone}?text=${msg}`, '_blank');
                }
                
                document.getElementById('complaint-form').reset();
                loadMyComplaints();
            } catch (err) { alert('Ralat: ' + err.message); }
            finally { btn.disabled = false; btn.innerText = 'Hantar Aduan'; }
        }

        async function loadMyComplaints() {
            const { data, error } = await _supabase.from('complaints').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            const tbody = document.getElementById('complaints-list');
            if (error || !data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Tiada aduan dihantar lagi.</td></tr>'; return; }
            tbody.innerHTML = data.map(item => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 font-medium text-gray-800">
                        <div>${Array.isArray(item.damage_types) ? item.damage_types.join(', ') : (item.damage_types || 'Kerosakan')}</div>
                        <div class="text-xs text-gray-400 font-normal truncate max-w-xs">${item.details || ''}</div>
                    </td>
                    <td class="p-3 text-gray-600">${item.department || '-'}</td>
                    <td class="p-3 text-gray-500 text-xs">${new Date(item.created_at).toLocaleDateString('ms-MY')}</td>
                    <td class="p-3">${getStatusBadge(item.status)}</td>
                </tr>
            `).join('');
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'BARU': return '<span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs font-semibold">BARU</span>';
                case 'PROSES': return '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-semibold">PROSES</span>';
                case 'SELESAI': return '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-semibold">SELESAI</span>';
                default: return `<span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-xs font-semibold">${status || 'BARU'}</span>`;
            }
        }

        async function logout() { await _supabase.auth.signOut(); window.location.href = 'login.html'; }
        
        checkAuth();
    </script>
</body>
</html>
