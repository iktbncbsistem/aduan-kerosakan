<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pemohon - Sistem Pengurusan IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header / Navibar -->
    <!-- Header / Navibar -->
    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
        <div>
            <h1 class="font-bold text-xl">Sistem Pengurusan IT</h1>
            <p class="text-xs text-blue-200">Portal Aduan Kerosakan IKTBN</p>
        </div>
        <div class="flex items-center gap-3">
            
            <!-- Tempat Letak Butang Menu Dinamik (Keluar ikut peranan) -->
            <div id="dynamic-menu" class="hidden sm:flex gap-2"></div>
            
            <span id="user-email-header" class="text-sm font-medium bg-blue-800 px-3 py-1 rounded hidden md:block">Memuatkan...</span>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm font-semibold transition shadow">Log Keluar</button>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto p-4 sm:p-6 mt-4">
        
        <!-- Menu Navigasi Tabs -->
        <div class="flex border-b-2 border-gray-200 mb-6">
            <button id="btn-tab-form" onclick="switchTab('form')" class="flex-1 py-3 text-sm sm:text-base font-bold text-blue-700 border-b-4 border-blue-700 transition-colors">
                📝 Borang Aduan
            </button>
            <button id="btn-tab-records" onclick="switchTab('records')" class="flex-1 py-3 text-sm sm:text-base font-bold text-gray-500 border-b-4 border-transparent hover:text-blue-600 transition-colors">
                📂 Rekod Aduan Saya
            </button>
        </div>

        <!-- TAB 1: Borang Aduan (Skrin Penuh) -->
        <div id="tab-form" class="bg-white p-6 sm:p-8 rounded-xl shadow-md border border-gray-100">
            <h2 class="text-xl font-bold mb-6 text-gray-800 border-b pb-3">Hantar Permohonan Penyenggaraan Baharu</h2>
            
            <form id="complaint-form" onsubmit="submitComplaint(event)">
                
                <!-- Profil Pemohon -->
                <div class="mb-6 flex flex-col sm:flex-row items-center sm:items-start gap-4 bg-blue-50 p-5 rounded-xl border border-blue-100 shadow-sm">
                    <div class="relative group cursor-pointer flex-shrink-0" onclick="document.getElementById('avatar-upload').click()" title="Klik untuk tukar gambar">
                        <img id="profile-avatar" src="https://ui-avatars.com/api/?name=U&background=0D8ABC&color=fff" class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md">
                        <div class="absolute inset-0 bg-black bg-opacity-50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-200">
                            <span class="text-white text-xs font-bold">Tukar</span>
                        </div>
                        <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
                    </div>
                    
                    <div class="flex-1 text-center sm:text-left mt-2 sm:mt-0 w-full">
                        <label class="block text-xs font-bold text-blue-800 uppercase mb-1 tracking-wider">Nama Pemohon</label>
                        
                        <div id="name-view-mode" class="flex flex-col sm:flex-row items-center sm:items-center gap-3">
                            <span id="display-name" class="font-bold text-gray-800 text-lg sm:text-xl break-all">Memuatkan...</span>
                            <button type="button" onclick="toggleEditName(true)" class="text-blue-700 hover:text-blue-900 text-xs bg-blue-200 hover:bg-blue-300 px-3 py-1.5 rounded-full font-semibold transition flex items-center gap-1 shadow-sm">✏️ Kemaskini</button>
                        </div>
                        
                        <div id="name-edit-mode" class="hidden flex flex-col sm:flex-row items-center gap-2 mt-2">
                            <input type="text" id="edit-name-input" placeholder="Taip nama penuh..." class="border-2 border-blue-200 rounded px-3 py-2 text-sm font-semibold text-gray-800 focus:border-blue-500 focus:ring-0 outline-none w-full sm:max-w-[250px]">
                            <div class="flex gap-2">
                                <button type="button" onclick="saveProfileName()" class="bg-green-600 hover:bg-green-700 text-white text-xs px-4 py-2.5 rounded font-bold shadow">Simpan</button>
                                <button type="button" onclick="toggleEditName(false)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-4 py-2.5 rounded font-bold">Batal</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Input Grid Utama -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">No. Telefon <span class="text-red-500">*</span></label>
                        <input type="tel" id="phone" required placeholder="Cth: 0123456789" class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Jabatan / Lokasi <span class="text-red-500">*</span></label>
                        <select id="department" required class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
                            <option value="">Pilih Jabatan</option>
                        </select>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Kategori Kerosakan <span class="text-red-500">*</span></label>
                    <div id="damage-types-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 bg-gray-50 p-4 rounded-lg border text-sm max-h-48 overflow-y-auto">
                        <span class="text-xs text-gray-400 col-span-full">Memuatkan kategori...</span>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Butiran Kerosakan <span class="text-red-500">*</span></label>
                    <textarea id="details" rows="3" required placeholder="Terangkan masalah atau kerosakan secara spesifik..." class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50"></textarea>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Justifikasi Keperluan Penyenggaraan <span class="text-red-500">*</span></label>
                    <textarea id="justification" rows="3" required placeholder="Sebab mendesak penyenggaraan ini perlu dijalankan..." class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8 bg-gray-50 p-4 rounded-lg border">
                    <div class="md:col-span-1">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Gambar Kerosakan</label>
                        <input type="file" id="image-file" accept="image/*" capture="environment" class="w-full border bg-white rounded p-1.5 text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-blue-100 file:text-blue-700 file:font-semibold hover:file:bg-blue-200">
                    </div>
                    <div class="md:col-span-1">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Upload Sebutharga</label>
                        <input type="file" id="quotation-file" accept=".pdf,.doc,.docx,image/*" class="w-full border bg-white rounded p-1.5 text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-gray-200 file:text-gray-700 file:font-semibold">
                    </div>
                    <div class="md:col-span-1">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Anggaran Kos (RM)</label>
                        <input type="number" step="0.01" id="estimated-cost" placeholder="0.00" class="w-full border rounded p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold text-base shadow-lg transition-transform transform hover:-translate-y-0.5">Hantar Permohonan Penyenggaraan</button>
            </form>
        </div>

        <!-- TAB 2: Rekod Aduan (Skrin Penuh) -->
        <div id="tab-records" class="hidden bg-white p-6 sm:p-8 rounded-xl shadow-md border border-gray-100">
            <h2 class="text-xl font-bold mb-6 text-gray-800 border-b pb-3">Rekod Aduan Saya</h2>
            <div class="overflow-x-auto rounded-lg border">
                <table class="w-full text-left text-sm whitespace-nowrap sm:whitespace-normal">
                    <thead class="bg-gray-100 border-b text-gray-700 uppercase text-xs font-bold">
                        <tr>
                            <th class="p-4 w-1/2">Butiran Kerosakan</th>
                            <th class="p-4">Lokasi</th>
                            <th class="p-4">Tarikh</th>
                            <th class="p-4 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="complaints-list" class="divide-y">
                        <tr><td colspan="4" class="p-6 text-center text-gray-400 font-medium">Memuatkan senarai aduan...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userProfile = null;
        let whatsappSettings = { enabled: false, phone: '' };

        // FUNGSI TUKAR TAB
        function switchTab(tabId) {
            document.getElementById('tab-form').classList.add('hidden');
            document.getElementById('tab-records').classList.add('hidden');
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            const btnForm = document.getElementById('btn-tab-form');
            const btnRecords = document.getElementById('btn-tab-records');
            
            if (tabId === 'form') {
                btnForm.className = "flex-1 py-3 text-sm sm:text-base font-bold text-blue-700 border-b-4 border-blue-700 transition-colors";
                btnRecords.className = "flex-1 py-3 text-sm sm:text-base font-bold text-gray-500 border-b-4 border-transparent hover:text-blue-600 transition-colors";
            } else {
                btnRecords.className = "flex-1 py-3 text-sm sm:text-base font-bold text-blue-700 border-b-4 border-blue-700 transition-colors";
                btnForm.className = "flex-1 py-3 text-sm sm:text-base font-bold text-gray-500 border-b-4 border-transparent hover:text-blue-600 transition-colors";
                loadMyComplaints(); // Refresh data bila buka tab rekod
            }
        }

        async function checkAuth() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session) { window.location.href = 'login.html'; return; }
                currentUser = session.user;
                
                document.getElementById('user-email-header').innerText = currentUser.email;

                const fullNameFallback = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email.split('@')[0];
                let { data: profile } = await _supabase.from('user_profiles').select('*').eq('email', currentUser.email).maybeSingle();
                
                if (!profile) {
                    const { data: newProfile } = await _supabase.from('user_profiles').insert([{
                        email: currentUser.email, full_name: fullNameFallback, role: 'PENDING', is_blocked: false
                    }]).select().single();
                    profile = newProfile;
                }
                userProfile = profile;

                if (profile.role === 'PENDING' || profile.role === 'TIADA' || profile.is_blocked) {
                    document.body.innerHTML = `
                        <div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
                            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-gray-200">
                                <div class="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-5 text-4xl shadow-inner">⏳</div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-3">Menunggu Pengesahan</h2>
                                <p class="text-gray-600 text-sm mb-6 leading-relaxed">Akaun anda (<span class="font-bold text-gray-800">${currentUser.email}</span>) telah didaftarkan. Sila tunggu kelulusan akses daripada Pentadbir Sistem (Admin).</p>
                                <button onclick="logout()" class="w-full bg-gray-800 hover:bg-gray-900 text-white px-5 py-3 rounded-lg font-bold text-sm shadow transition">Log Keluar</button>
                            </div>
                        </div>`;
                    return;
                }

                updateProfileUI();

                // --- SISTEM HALA TUJU (ROUTING) & MENU DINAMIK ---
                const menuContainer = document.getElementById('dynamic-menu');
                menuContainer.innerHTML = '';
                
                if (profile.role === 'ADMIN') {
                    menuContainer.innerHTML += `<a href="admin.html" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded text-sm font-bold shadow transition">⚙️ Panel Admin</a>`;
                }
                if (profile.role === 'CPPP' || profile.role === 'ADMIN') {
                    menuContainer.innerHTML += `<a href="cppp.html" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-sm font-bold shadow transition">🔧 Panel CPPP</a>`;
                }
                if (profile.role === 'KCPPP' || profile.role === 'ADMIN') {
                    menuContainer.innerHTML += `<a href="kcppp.html" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-sm font-bold shadow transition">✅ Panel KCPPP</a>`;
                }
                menuContainer.classList.remove('hidden');

                // Auto-Redirect ke page peranan 
                if (!sessionStorage.getItem('sudah_redirect')) {
                    sessionStorage.setItem('sudah_redirect', 'true');
                    
                    if (profile.role === 'CPPP') {
                        window.location.href = 'cppp.html'; return;
                    } else if (profile.role === 'KCPPP') {
                        window.location.href = 'kcppp.html'; return;
                    } else if (profile.role === 'ADMIN') {
                        window.location.href = 'admin.html'; return;
                    }
                }
                // ------------------------------------------------
            

                await loadMasterData();
                loadMyComplaints();
            } catch (error) {
                console.error("Ralat Auth:", error);
                alert("Ralat sistem. Sila muat semula halaman.");
            }
        }
        // ================= KEMASKINI PROFIL & GAMBAR =================
        function updateProfileUI() {
            const displayName = userProfile.full_name || currentUser.email.split('@')[0];
            document.getElementById('display-name').innerText = displayName;
            document.getElementById('edit-name-input').value = displayName;
            
            const avatarImg = document.getElementById('profile-avatar');
            if (userProfile.avatar_url) {
                avatarImg.src = userProfile.avatar_url;
            } else {
                avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=0D8ABC&color=fff&size=128&bold=true`;
            }
        }

        function toggleEditName(show) {
            document.getElementById('name-view-mode').classList.toggle('hidden', show);
            document.getElementById('name-edit-mode').classList.toggle('hidden', !show);
            if (show) document.getElementById('edit-name-input').focus();
        }

        async function saveProfileName() {
            const newName = document.getElementById('edit-name-input').value.trim();
            if (!newName) return alert("Sila masukkan nama.");
            
            const btn = document.querySelector('#name-edit-mode button');
            btn.innerText = 'Menyimpan...'; btn.disabled = true;

            const { error } = await _supabase.from('user_profiles').update({ full_name: newName }).eq('email', currentUser.email);
            
            if (!error) {
                userProfile.full_name = newName;
                updateProfileUI();
                toggleEditName(false);
            } else {
                alert("Gagal mengemaskini nama: " + error.message);
            }
            btn.innerText = 'Simpan'; btn.disabled = false;
        }

        async function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('profile-avatar').style.opacity = '0.5';

            try {
                const compressedImage = await compressImage(file, 400); 
                const filePath = `avatars/${currentUser.id}_${Date.now()}.jpg`;
                
                const { error: uploadError } = await _supabase.storage.from('complaint_attachments').upload(filePath, compressedImage, { upsert: true });
                if (uploadError) throw uploadError;

                const publicUrl = _supabase.storage.from('complaint_attachments').getPublicUrl(filePath).data.publicUrl;
                
                const { error: updateError } = await _supabase.from('user_profiles').update({ avatar_url: publicUrl }).eq('email', currentUser.email);
                if (updateError) throw updateError;

                userProfile.avatar_url = publicUrl;
                updateProfileUI();
            } catch (err) {
                alert("Ralat muat naik gambar: " + err.message);
            } finally {
                document.getElementById('profile-avatar').style.opacity = '1';
                event.target.value = '';
            }
        }

        // ================= FUNGSI ADUAN =================
        async function loadMasterData() {
            const { data: locations } = await _supabase.from('locations').select('*').order('name');
            const deptSelect = document.getElementById('department');
            if (locations && locations.length > 0) {
                deptSelect.innerHTML = '<option value="">Pilih Jabatan / Lokasi</option>' + locations.map(l => `<option value="${l.name}">${l.name}</option>`).join('');
            }

            const { data: settings } = await _supabase.from('system_settings').select('*');
            let damageTypes = ["Perkakasan (Hardware)", "Perisian (Software)", "Rangkaian / Wi-Fi", "Pencetak (Printer)", "Lain-lain"];
            
            if (settings) {
                const typesSetting = settings.find(s => s.key === 'damage_types');
                if (typesSetting && typesSetting.value) damageTypes = JSON.parse(typesSetting.value);
                const waEnabled = settings.find(s => s.key === 'whatsapp_enabled');
                const waPhone = settings.find(s => s.key === 'whatsapp_number');
                whatsappSettings.enabled = waEnabled ? waEnabled.value === 'true' : false;
                whatsappSettings.phone = waPhone ? waPhone.value : '';
            }

            document.getElementById('damage-types-container').innerHTML = damageTypes.map(type => `
                <label class="flex items-center gap-2 cursor-pointer p-2 hover:bg-white rounded border border-transparent hover:border-gray-200 transition">
                    <input type="checkbox" name="damage_types" value="${type}" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                    <span class="text-sm font-medium text-gray-700">${type}</span>
                </label>
            `).join('');
        }

        function compressImage(file, max_size = 1200) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > max_size) { h *= max_size / w; w = max_size; } } 
                        else { if (h > max_size) { w *= max_size / h; h = max_size; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        canvas.toBlob(blob => resolve(new File([blob], file.name, { type: 'image/jpeg' })), 'image/jpeg', 0.8);
                    };
                };
            });
        }

        async function submitComplaint(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = 'Memproses Permohonan...';
            
            try {
                const selectedDamageTypes = Array.from(document.querySelectorAll('input[name="damage_types"]:checked')).map(cb => cb.value);
                if (selectedDamageTypes.length === 0) { alert('Sila pilih kategori kerosakan.'); btn.disabled = false; btn.innerText = 'Hantar Permohonan Penyenggaraan'; return; }
                
                let imageUrl = null, quotationUrl = null;
                const imgFile = document.getElementById('image-file').files[0];
                if (imgFile) {
                    const compFile = await compressImage(imgFile);
                    const path = `images/${Date.now()}_${compFile.name}`;
                    const { error } = await _supabase.storage.from('complaint_attachments').upload(path, compFile);
                    if (!error) imageUrl = _supabase.storage.from('complaint_attachments').getPublicUrl(path).data.publicUrl;
                }
                
                const quoteFile = document.getElementById('quotation-file').files[0];
                if (quoteFile) {
                    const path = `quotations/${Date.now()}_${quoteFile.name}`;
                    const { error } = await _supabase.storage.from('complaint_attachments').upload(path, quoteFile);
                    if (!error) quotationUrl = _supabase.storage.from('complaint_attachments').getPublicUrl(path).data.publicUrl;
                }

                const newComplaint = {
                    user_id: currentUser.id, full_name: userProfile.full_name,
                    email: currentUser.email, phone: document.getElementById('phone').value,
                    department: document.getElementById('department').value, damage_types: selectedDamageTypes,
                    details: document.getElementById('details').value, justification: document.getElementById('justification').value,
                    estimated_cost: parseFloat(document.getElementById('estimated-cost').value || 0),
                    image_url: imageUrl, quotation_url: quotationUrl, status: 'BARU'
                };

                const { error } = await _supabase.from('complaints').insert([newComplaint]);
                if (error) throw error;
                
                alert('Berjaya dihantar!');
                
                if (whatsappSettings.enabled && whatsappSettings.phone) {
                    const msg = `*PERMOHONAN PENYENGGARAAN BARU*%0A*Pemohon:* ${newComplaint.full_name}%0A*Lokasi:* ${newComplaint.department}%0A*Kerosakan:* ${selectedDamageTypes.join(', ')}`;
                    window.open(`https://wa.me/${whatsappSettings.phone}?text=${msg}`, '_blank');
                }
                
                document.getElementById('complaint-form').reset();
                switchTab('records'); // Lompat terus ke tab rekod selepas berjaya hantar

            } catch (err) { alert('Ralat: ' + err.message); }
            finally { btn.disabled = false; btn.innerText = 'Hantar Permohonan Penyenggaraan'; }
        }

        async function loadMyComplaints() {
            const { data, error } = await _supabase.from('complaints').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            const tbody = document.getElementById('complaints-list');
            if (error || !data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-500 font-medium bg-gray-50">Belum ada sebarang rekod permohonan dihantar.</td></tr>'; return; }
            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-blue-50 transition-colors">
                    <td class="p-4">
                        <div class="font-bold text-gray-800">${Array.isArray(item.damage_types) ? item.damage_types.join(', ') : (item.damage_types || 'Kerosakan')}</div>
                        <div class="text-sm text-gray-500 mt-1 line-clamp-2">${item.details || ''}</div>
                    </td>
                    <td class="p-4 font-medium text-gray-700">${item.department || '-'}</td>
                    <td class="p-4 text-gray-600 text-sm font-medium">${new Date(item.created_at).toLocaleDateString('ms-MY', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
                    <td class="p-4 text-center">${getStatusBadge(item.status)}</td>
                </tr>
            `).join('');
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'BARU': return '<span class="bg-amber-100 text-amber-800 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm">BARU</span>';
                case 'PROSES': return '<span class="bg-blue-100 text-blue-800 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm">PROSES</span>';
                case 'SELESAI': return '<span class="bg-emerald-100 text-emerald-800 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm">SELESAI</span>';
                default: return `<span class="bg-gray-100 text-gray-800 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm">${status || 'BARU'}</span>`;
            }
        }

        async function logout() { await _supabase.auth.signOut(); window.location.href = 'login.html'; }
        
        checkAuth();
    </script>
</body>
