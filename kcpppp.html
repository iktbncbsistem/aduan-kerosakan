<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard KCPPPP - SISTEM ADUAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <nav class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center">
        <div class="font-bold text-lg">👑 Kelulusan KCPPPP</div>
        <div class="space-x-4">
            <a href="cppp.html" class="text-sm hover:underline">Tukar ke CPPP</a>
            <button onclick="logout()" class="text-sm bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-semibold transition">Log Keluar</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow border border-slate-100">
                <div class="text-slate-500 text-sm font-semibold">Jumlah Aduan</div>
                <div id="stat-total" class="text-3xl font-bold text-slate-800 mt-1">0</div>
            </div>
            <div class="bg-purple-50 p-4 rounded-xl shadow border border-purple-100">
                <div class="text-purple-600 text-sm font-semibold">Menunggu Keputusan</div>
                <div id="stat-pending" class="text-3xl font-bold text-purple-700 mt-1">0</div>
            </div>
            <div class="bg-emerald-50 p-4 rounded-xl shadow border border-emerald-100">
                <div class="text-emerald-600 text-sm font-semibold">Selesai Ditutup</div>
                <div id="stat-completed" class="text-3xl font-bold text-emerald-700 mt-1">0</div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="p-5 border-b bg-slate-50 font-bold text-slate-700">Tindakan KCPPPP</div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-sm uppercase tracking-wider">
                            <th class="p-4 border-b">No. Tiket</th>
                            <th class="p-4 border-b">Syor CPPP</th>
                            <th class="p-4 border-b">Status</th>
                            <th class="p-4 border-b">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-sm divide-y divide-slate-100">
                        <tr><td colspan="4" class="p-4 text-center text-slate-500">Memuatkan data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal KCPPPP -->
    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="p-5 border-b flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h2 class="font-bold text-lg text-slate-800">Keputusan Muktamad KCPPPP</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 font-bold text-xl">&times;</button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-1 space-y-6">
                <!-- Info Syor CPPP -->
                <div class="bg-purple-50 p-4 rounded-lg text-sm space-y-2 border border-purple-100">
                    <h3 class="font-bold text-purple-800 mb-2">Maklum Balas CPPP</h3>
                    <div><span class="text-purple-600 font-semibold">Klasifikasi:</span> <span id="m-syor" class="font-bold"></span></div>
                    <div><span class="text-purple-600 font-semibold">Catatan:</span> <p id="m-catatan-cppp" class="mt-1 bg-white p-2 border rounded italic"></p></div>
                </div>

                <!-- Info Aduan Asal -->
                <div class="bg-slate-50 p-4 rounded-lg text-xs space-y-1 border">
                    <div><span class="text-gray-500">No. Tiket:</span> <span id="m-tiket" class="font-bold"></span> | <span class="text-gray-500">Pemohon:</span> <span id="m-nama" class="font-bold"></span></div>
                    <div><span class="text-gray-500">Butiran:</span> <span id="m-butiran"></span></div>
                    <div><span class="text-gray-500 block mt-2">Lampiran:</span> <div id="m-lampiran" class="space-y-1 mt-1"></div></div>
                </div>

                <!-- Form Keputusan KCPPPP -->
                <form id="kcpppp-form" class="space-y-4">
                    <input type="hidden" id="m-id">
                    
                    <div>
                        <label class="block font-bold text-sm text-slate-700 mb-2">Keputusan KCPPPP</label>
                        <select id="m-keputusan" required class="w-full border rounded-lg p-3 bg-white outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                            <option value="">-- Sila Pilih --</option>
                            <option value="DILULUSKAN / DISAHKAN">DILULUSKAN / DISAHKAN</option>
                            <option value="KIV (TUNGGU PERUNTUKAN)">KIV (TUNGGU PERUNTUKAN)</option>
                            <option value="DITOLAK">DITOLAK</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-bold text-sm text-slate-700 mb-2">Ulasan Akhir</label>
                        <textarea id="m-ulasan" required rows="3" class="w-full border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Sila masukkan arahan atau ulasan akhir..."></textarea>
                    </div>

                    <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
                        TUTUP ADUAN (SELESAI)
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkAuth() {
            const { data: { session } } = await client.auth.getSession();
            if (!session) window.location.href = 'login.html';
            else loadData();
        }
        checkAuth();

        async function logout() {
            await client.auth.signOut();
            window.location.href = 'login.html';
        }

        async function loadData() {
            const { data, error } = await client.from('complaints').select(`*, complaint_attachments(*)`).order('updated_at', { ascending: false });
            if (error) return console.error(error);

            document.getElementById('stat-total').innerText = data.length;
            document.getElementById('stat-pending').innerText = data.filter(d => d.status === 'KCPPPP_REVIEW').length;
            document.getElementById('stat-completed').innerText = data.filter(d => d.status === 'COMPLETED').length;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            // Filter hanya tunjuk KCPPPP_REVIEW dan COMPLETED
            const filteredData = data.filter(d => d.status === 'KCPPPP_REVIEW' || d.status === 'COMPLETED');

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">Tiada aduan menunggu keputusan.</td></tr>';
                return;
            }

            filteredData.forEach(item => {
                const badgeColor = item.status === 'KCPPPP_REVIEW' ? 'bg-purple-100 text-purple-800' : 'bg-emerald-100 text-emerald-800';
                
                const btnHtml = item.status === 'KCPPPP_REVIEW' 
                    ? `<button onclick='openModal(${JSON.stringify(item).replace(/'/g, "&#39;")})' class="text-indigo-600 hover:bg-indigo-50 px-3 py-1 rounded font-semibold border border-indigo-200">Beri Keputusan</button>`
                    : `<span class="text-xs text-gray-400 font-semibold">Telah Ditutup</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                        <td class="p-4 font-mono text-xs font-bold">${item.ticket_number}</td>
                        <td class="p-4 font-semibold text-xs text-slate-600">${item.cppp_classification || '-'}</td>
                        <td class="p-4"><span class="px-2 py-1 text-xs font-bold rounded-full ${badgeColor}">${item.status}</span></td>
                        <td class="p-4">${btnHtml}</td>
                    </tr>
                `;
            });
        }

        const modal = document.getElementById('modal');
        function openModal(data) {
            document.getElementById('m-id').value = data.id;
            document.getElementById('m-tiket').innerText = data.ticket_number;
            document.getElementById('m-nama').innerText = data.applicant_name;
            document.getElementById('m-butiran').innerText = data.description;
            document.getElementById('m-syor').innerText = data.cppp_classification || 'Tiada Syor';
            document.getElementById('m-catatan-cppp').innerText = data.cppp_notes || 'Tiada catatan';
            
            const lampiranBox = document.getElementById('m-lampiran');
            lampiranBox.innerHTML = '';
            if (data.complaint_attachments && data.complaint_attachments.length > 0) {
                data.complaint_attachments.forEach(file => {
                    const { data: urlData } = client.storage.from('attachments').getPublicUrl(file.storage_path);
                    lampiranBox.innerHTML += `<a href="${urlData.publicUrl}" target="_blank" class="text-blue-600 hover:underline block truncate">📄 ${file.file_name}</a>`;
                });
            } else {
                lampiranBox.innerHTML = '<span class="text-gray-400">Tiada lampiran</span>';
            }
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('kcpppp-form').reset();
        }

        document.getElementById('kcpppp-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!confirm("Adakah anda pasti untuk menutup aduan ini?")) return;

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            const id = document.getElementById('m-id').value;
            const keputusan = document.getElementById('m-keputusan').value;
            const ulasan = document.getElementById('m-ulasan').value;

            const { error } = await client.from('complaints').update({
                status: 'COMPLETED',
                kcpppp_decision: keputusan,
                kcpppp_notes: ulasan,
                updated_at: new Date().toISOString()
            }).eq('id', id);

            if (error) {
                alert("Gagal mengemaskini status.");
                console.error(error);
            } else {
                closeModal();
                loadData(); 
            }
            btn.disabled = false;
            btn.innerText = 'TUTUP ADUAN (SELESAI)';
        });
    </script>
</body>
</html>
