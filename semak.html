<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semakan Status Aduan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen relative flex items-center justify-center py-10 font-sans">

    <!-- Lapisan Gelap Background -->
    <div id="bg-overlay" class="absolute inset-0 bg-gray-900/50 hidden z-0"></div>

    <div class="relative z-10 w-full max-w-xl mx-auto px-4 sm:px-6">
        <div class="bg-white rounded-xl shadow-xl border border-gray-100 overflow-hidden">
            
            <div class="bg-gray-50 px-6 py-6 border-b border-gray-200 text-center relative">
                <a href="index.html" class="absolute left-6 top-6 text-sm text-gray-500 hover:text-blue-600 font-medium">← Kembali</a>
                <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight mt-6 md:mt-0">Semakan Status</h2>
                <p class="text-sm text-gray-500 mt-2">Semak perkembangan aduan anda di sini.</p>
            </div>

            <div class="p-6 md:p-8">
                <!-- Borang Carian -->
                <form id="search-form" class="flex gap-2">
                    <input type="text" id="carian" required placeholder="Masukkan No. Tiket (Cth: TIC-12345)" class="flex-1 block w-full border border-gray-300 rounded-md p-3 outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 text-sm font-mono font-bold uppercase">
                    <button type="submit" id="btn-search" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-md shadow-sm transition">Cari</button>
                </form>

                <!-- Status Mesej (Loading/Error) -->
                <div id="status-msg" class="text-center text-sm font-medium mt-4 text-gray-500 hidden"></div>

                <!-- Kad Keputusan Carian -->
                <div id="result-card" class="hidden mt-8 border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                    <div class="bg-gray-50 px-4 py-3 border-b border-gray-200 flex justify-between items-center">
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Maklumat Tiket</span>
                        <span id="r-tiket" class="font-mono font-black text-gray-900"></span>
                    </div>
                    <div class="p-5 space-y-4 bg-white">
                        
                        <div class="flex justify-between items-start border-b border-gray-100 pb-4">
                            <div>
                                <span class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Status Terkini</span>
                                <div id="r-status-badge"></div>
                            </div>
                            <div class="text-right">
                                <span class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Tarikh Laporan</span>
                                <span id="r-tarikh" class="text-sm font-medium text-gray-800"></span>
                            </div>
                        </div>

                        <div>
                            <span class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Kerosakan Dilaporkan</span>
                            <p id="r-butiran" class="text-sm text-gray-800 bg-gray-50 p-3 rounded border border-gray-100"></p>
                        </div>

                        <!-- Ruangan Ulasan Pegawai (Tunjuk jika ada) -->
                        <div id="ulasan-section" class="hidden border-t border-gray-100 pt-4 mt-2">
                            <span class="block text-xs text-gray-400 uppercase tracking-wider mb-2">Maklum Balas Pegawai</span>
                            <div id="r-ulasan" class="text-sm text-indigo-800 bg-indigo-50 p-3 rounded border border-indigo-100 italic"></div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Tarik Gambar Latar
        async function loadBackground() {
            const { data: settings } = await client.from('system_settings').select('bg_url').eq('id', 1).single();
            if (settings && settings.bg_url) {
                document.body.style.backgroundImage = `url('${settings.bg_url}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
                document.getElementById('bg-overlay').classList.remove('hidden');
            }
        }
        loadBackground();

        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-search');
            const msgBox = document.getElementById('status-msg');
            const resultCard = document.getElementById('result-card');
            
            btn.disabled = true;
            btn.innerText = '...';
            msgBox.classList.remove('hidden');
            msgBox.innerHTML = 'Mencari rekod...';
            resultCard.classList.add('hidden');

            const carianValue = document.getElementById('carian').value.trim().toUpperCase();

            const { data, error } = await client.from('complaints').select('*').eq('ticket_number', carianValue).single();

            if (error || !data) {
                msgBox.innerHTML = '<span class="text-red-500">Rekod tidak dijumpai. Sila semak semula No. Tiket anda.</span>';
            } else {
                msgBox.classList.add('hidden');
                
                // Isi Maklumat
                document.getElementById('r-tiket').innerText = data.ticket_number;
                const d = new Date(data.created_at);
                document.getElementById('r-tarikh').innerText = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
                document.getElementById('r-butiran').innerText = data.description;

                // Tentukan Warna Status & Nama Cantik
                let badgeHtml = '';
                let ulasanText = '';
                
                if(data.status === 'SUBMITTED') {
                    badgeHtml = '<span class="px-3 py-1 bg-blue-100 text-blue-700 font-bold text-xs rounded-full border border-blue-200">BARU (DALAM SIASATAN)</span>';
                } else if(data.status === 'KCPPP_REVIEW') {
                    badgeHtml = '<span class="px-3 py-1 bg-purple-100 text-purple-700 font-bold text-xs rounded-full border border-purple-200">MENUNGGU KELULUSAN (KCPPP)</span>';
                    ulasanText = data.cppp_notes ? `Syor CPPP: ${data.cppp_notes}` : '';
                } else if(data.status === 'COMPLETED') {
                    badgeHtml = '<span class="px-3 py-1 bg-emerald-100 text-emerald-700 font-bold text-xs rounded-full border border-emerald-200">SELESAI / DITUTUP</span>';
                    ulasanText = data.kcppp_notes ? `Keputusan KCPPP: ${data.kcppp_notes}` : '';
                }

                document.getElementById('r-status-badge').innerHTML = badgeHtml;

                const ulasanBox = document.getElementById('ulasan-section');
                if (ulasanText) {
                    ulasanBox.classList.remove('hidden');
                    document.getElementById('r-ulasan').innerText = ulasanText;
                } else {
                    ulasanBox.classList.add('hidden');
                }

                resultCard.classList.remove('hidden');
            }

            btn.disabled = false;
            btn.innerText = 'Cari';
        });
    </script>
</body>
</html>
