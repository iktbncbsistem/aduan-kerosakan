<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Sistem Aduan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

<!-- Navigasi Utiliti Admin / Tetapan -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center space-x-6">
            <span class="font-bold text-gray-900 text-lg tracking-tight">⚙️ Tetapan & Pentadbiran Sistem</span>
            <div class="hidden md:flex space-x-4 text-sm font-medium">
                <button onclick="window.history.back()" class="text-gray-500 hover:text-gray-900 transition flex items-center gap-1">
                    ← Kembali ke Dashboard
                </button>
                <a href="laporan.html" class="text-gray-500 hover:text-gray-900 transition">📊 Modul Laporan</a>
            </div>
        </div>
        <button onclick="logout()" class="text-sm font-medium text-gray-600 hover:text-red-600 border border-gray-200 hover:bg-red-50 px-3 py-1.5 rounded transition">Log Keluar</button>
    </nav>

    <!-- Seksyen Pengurusan Akses Pengguna Berpusat -->
    <main class="max-w-5xl mx-auto p-6 space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-lg font-bold text-gray-900">👥 Pengurusan Akses Pengguna (RBAC)</h2>
                    <p class="text-sm text-gray-500">Kawal tahap akses sistem untuk semua kakitangan IKTBN Chembong.</p>
                </div>
                <button onclick="loadUsers()" class="text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded transition flex items-center gap-2">
                    🔄 Muat Semula
                </button>
            </div>
            
            <div class="overflow-x-auto border border-gray-200 rounded-lg">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm border-b border-gray-200">
                            <th class="py-3 px-4 font-semibold w-16 text-center">Bil</th>
                            <th class="py-3 px-4 font-semibold">E-mel Kakitangan</th>
                            <th class="py-3 px-4 font-semibold w-48 text-center">Peranan Semasa</th>
                            <th class="py-3 px-4 font-semibold w-32 text-center">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="text-sm divide-y divide-gray-100">
                        <tr><td colspan="4" class="text-center py-8 text-gray-500 italic">Memuatkan data pengguna...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initAdmin() {
            const { data: { session } } = await client.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            
            // Muatkan jadual RBAC bila admin buka muka surat ini
            loadUsers();
        }

        async function logout() {
            await client.auth.signOut();
            window.location.href = 'login.html';
        }

        // ==========================================
        // FUNGSI PENGURUSAN PENGGUNA BERPUSAT (RBAC)
        // ==========================================
        async function loadUsers() {
            const tbody = document.getElementById('user-table-body');
            if(!tbody) return;

            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500 italic">Memuatkan senarai pengguna...</td></tr>';
            
            const { data, error } = await client.from('user_profiles').select('*').order('email', { ascending: true });
            
            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-red-500 font-semibold">Ralat: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500 italic">Tiada rekod ditemui. Staf perlu log masuk sekurang-kurangnya sekali.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach((user, index) => {
                const roles = ['STAF', 'CPPP', 'KCPPP', 'ADMIN'];
                let optionsHtml = '';
                
                roles.forEach(r => {
                    const selected = user.role === r ? 'selected' : '';
                    optionsHtml += `<option value="${r}" ${selected}>${r}</option>`;
                });

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition border-b border-gray-100 last:border-0">
                        <td class="py-3 px-4 text-center text-gray-500 font-medium">${index + 1}</td>
                        <td class="py-3 px-4 font-bold text-gray-800">${user.email}</td>
                        <td class="py-3 px-4">
                            <select id="role-${user.id}" class="w-full border border-gray-300 rounded-md p-1.5 text-sm font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-center cursor-pointer bg-white shadow-sm">
                                ${optionsHtml}
                            </select>
                        </td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="updateRole('${user.id}', '${user.email}')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-md text-xs font-bold transition shadow-sm">
                                Simpan
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function updateRole(userId, userEmail) {
            const newRole = document.getElementById(`role-${userId}`).value;
            const confirmUpdate = confirm(`Sahkan pertukaran pangkat:\nE-mel: ${userEmail}\nPeranan Baharu: ${newRole}`);
            
            if (!confirmUpdate) return;

            // Update ke jadual user_profiles
            const { error } = await client.from('user_profiles').update({ role: newRole }).eq('id', userId);

            if (error) {
                alert("Ralat mengemaskini peranan: " + error.message);
            } else {
                alert(`✅ BERJAYA: ${userEmail} kini adalah ${newRole}.`);
                loadUsers(); // Refresh jadual
            }
        }

        // Mulakan sistem admin
        initAdmin();
    </script>
</body>
</html>
