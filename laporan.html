<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan & Bajet - SISTEM ADUAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Tetapan cetakan PDF yang bersih */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; font-size: 11pt; }
            .print-container { max-width: 100% !important; padding: 0 !important; box-shadow: none !important; border: none !important; margin: 0 !important; }
            .print-break { page-break-inside: avoid; }
            table { border-collapse: collapse; width: 100%; }
            th, td { border: 1px solid #ddd; padding: 8px; }
            th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <!-- Navigasi (Dihilangkan masa cetak) -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-10 no-print">
        <div class="flex items-center space-x-6">
            <span class="font-bold text-gray-900 text-lg tracking-tight">📊 Modul Laporan</span>
            <div class="hidden md:flex space-x-4 text-sm font-medium text-gray-500">
                <a href="cppp.html" class="hover:text-gray-900 transition">CPPP</a>
                <a href="kcppp.html" class="hover:text-gray-900 transition">KCPPP</a>
                <a href="admin.html" class="hover:text-gray-900 transition">Admin</a>
            </div>
        </div>
        <button onclick="window.history.back()" class="text-sm font-medium text-gray-600 hover:text-gray-900 border border-gray-200 hover:bg-gray-50 px-3 py-1.5 rounded transition">Kembali</button>
    </nav>

    <div class="max-w-7xl mx-auto p-4 md:p-8 print-container">
        
        <!-- Header Dokumen (Dipaparkan dalam PDF) -->
        <div class="text-center mb-10 pb-6 border-b border-gray-300">
            <h1 class="text-2xl font-bold uppercase tracking-wide text-gray-900">Laporan Aduan Kerosakan & Keperluan Bajet</h1>
            <p class="text-gray-600 font-medium mt-1">Institusi Kemahiran Tinggi Belia Negara (IKTBN) Chembong</p>
        </div>

        <!-- Filter Section (Tidak dicetak) -->
        <div class="no-print bg-white p-5 rounded-lg border border-gray-200 shadow-sm mb-8 flex flex-wrap gap-4 items-end">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Tahun Rekod</label>
                <select id="filter-tahun" class="border border-gray-300 p-2 rounded-md w-32 text-sm outline-none focus:ring-1 focus:ring-blue-500">
                    <option value="ALL">Semua</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Lokasi Kerosakan</label>
                <select id="filter-lokasi" class="border border-gray-300 p-2 rounded-md w-48 text-sm outline-none focus:ring-1 focus:ring-blue-500">
                    <option value="ALL">Semua Lokasi</option>
                    <!-- Dinamik -->
                </select>
            </div>
            <button onclick="renderTable()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-semibold shadow-sm transition">Tapis Data</button>
            <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-md text-sm font-semibold shadow-sm transition ml-auto flex items-center gap-2">
                🖨️ Cetak / PDF
            </button>
        </div>

        <!-- Rumusan Bajet -->
        <div class="grid grid-cols-2 gap-6 mb-8 print-break">
            <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm text-center">
                <div class="text-xs font-bold text-gray-500 uppercase tracking-wider">Jumlah Kes Disemak</div>
                <div id="sum-aduan" class="text-3xl font-bold text-gray-900 mt-1">0</div>
            </div>
            <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm text-center">
                <div class="text-xs font-bold text-gray-500 uppercase tracking-wider">Anggaran Kos Keseluruhan (RM)</div>
                <div id="sum-kos" class="text-3xl font-bold text-red-600 mt-1">0.00</div>
            </div>
        </div>

        <!-- Jadual Data Laporan -->
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-200">
                            <th class="px-4 py-3 font-semibold w-12 text-center border-r border-gray-200">No</th>
                            <th class="px-4 py-3 font-semibold border-r border-gray-200">Maklumat Aduan</th>
                            <th class="px-4 py-3 font-semibold w-1/3 border-r border-gray-200">Justifikasi Pembaikan</th>
                            <th class="px-4 py-3 font-semibold text-right border-r border-gray-200">Kos (RM)</th>
                            <th class="px-4 py-3 font-semibold">Status</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-200">
                        <tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">Memuatkan rekod laporan...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allData = [];

        async function checkAuth() {
            const { data: { session } } = await client.auth.getSession();
            if (!session) window.location.href = 'login.html';
            else loadData();
        }
        checkAuth();

        async function loadData() {
            // Tarik Lokasi Dinamik
            const { data: locData } = await client.from('locations').select('name').order('created_at', { ascending: true });
            if (locData) {
                const locSelect = document.getElementById('filter-lokasi');
                locData.forEach(loc => {
                    locSelect.innerHTML += `<option value="${loc.name}">${loc.name}</option>`;
                });
            }

            // Tarik Aduan
            const { data, error } = await client.from('complaints').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);
            
            allData = data;
            setupTahunDropdown();
            renderTable();
        }

        function setupTahunDropdown() {
            const tahunSet = new Set();
            allData.forEach(d => {
                const year = new Date(d.created_at).getFullYear();
                tahunSet.add(year);
            });
            
            const dropdown = document.getElementById('filter-tahun');
            Array.from(tahunSet).sort().reverse().forEach(year => {
                dropdown.innerHTML += `<option value="${year}">${year}</option>`;
            });
        }

        function renderTable() {
            const fTahun = document.getElementById('filter-tahun').value;
            const fLokasi = document.getElementById('filter-lokasi').value;

            let filtered = allData.filter(d => {
                const yearMatch = fTahun === 'ALL' || new Date(d.created_at).getFullYear().toString() === fTahun;
                const lokasiMatch = fLokasi === 'ALL' || d.location === fLokasi;
                return yearMatch && lokasiMatch;
            });

            let totalKos = 0;
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if(filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">Tiada rekod dijumpai.</td></tr>';
            } else {
                filtered.forEach((item, index) => {
                    const kos = item.estimated_cost ? parseFloat(item.estimated_cost) : 0;
                    totalKos += kos;

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 print-break">
                            <td class="px-4 py-3 border-r border-gray-200 text-center font-medium text-gray-500">${index + 1}</td>
                            <td class="px-4 py-3 border-r border-gray-200">
                                <div class="font-mono text-xs font-bold text-gray-900 mb-1">${item.ticket_number}</div>
                                <div class="font-semibold text-gray-700">${item.location}</div>
                                <div class="text-xs text-gray-500 mt-1">${item.categories.join(', ')}</div>
                            </td>
                            <td class="px-4 py-3 border-r border-gray-200 text-gray-700 text-sm italic">${item.justification || '-'}</td>
                            <td class="px-4 py-3 border-r border-gray-200 text-right font-semibold text-gray-900">${kos > 0 ? kos.toLocaleString('ms-MY', { minimumFractionDigits: 2 }) : '-'}</td>
                            <td class="px-4 py-3 text-xs font-bold text-gray-600">${item.status}</td>
                        </tr>
                    `;
                });
            }

            document.getElementById('sum-aduan').innerText = filtered.length;
            document.getElementById('sum-kos').innerText = totalKos.toLocaleString('ms-MY', { minimumFractionDigits: 2 });
        }
    </script>
</body>
</html>
