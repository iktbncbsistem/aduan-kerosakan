<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel CPPP - Sistem Pengurusan IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    
    <nav class="bg-emerald-800 text-white p-4 shadow-lg flex justify-between items-center">
        <div>
            <h1 class="font-bold text-xl">Sistem Pengurusan IT</h1>
            <p class="text-xs text-emerald-200">Panel Pengurusan Aduan CPPP / KCPPP</p>
        </div>
        <div class="flex gap-3 items-center">
            <a href="index.html" class="bg-emerald-900 hover:bg-emerald-950 px-3 py-1.5 rounded text-sm font-semibold transition">Borang Aduan (Staf)</a>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm font-semibold transition shadow">Log Keluar</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 mt-4">
        <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100 text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Selamat Datang ke Panel CPPP</h2>
            <p class="text-gray-600">Halaman ini akan digunakan untuk menyemak senarai aduan dan mengagihkan tugasan kepada juruteknik.</p>
        </div>
    </div>

    <script>
const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function checkAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            
            const { data: profile } = await _supabase.from('user_profiles').select('role').eq('email', session.user.email).single();
            
            if (!profile || (profile.role !== 'CPPP' && profile.role !== 'KCPPP' && profile.role !== 'ADMIN')) {
                alert('Akses Ditolak! Panel ini khas untuk pegawai CPPP sahaja.');
                window.location.href = 'index.html';
            }
        }

        async function logout() { 
            sessionStorage.clear(); // Bersihkan memori redirect
            await _supabase.auth.signOut(); 
            window.location.href = 'login.html'; 
        }

        checkAuth();
    </script>
</body>
</html>
