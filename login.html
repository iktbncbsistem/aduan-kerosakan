<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log Masuk Staf - Sistem Aduan Kerosakan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=1080&auto=format&fit=crop')] bg-cover bg-center bg-fixed min-h-screen flex items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8 border border-white/50">
        
        <div class="text-center mb-6">
            <img src="https://cetaoxubcdityyhcvtsy.supabase.co/storage/v1/object/public/logo/logo.png" alt="Logo Organisasi" class="w-20 h-20 mx-auto object-contain mb-3 p-1 rounded-xl border border-gray-100">
            <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Sistem Penyenggaraan</h1>
            <p id="form-subtitle" class="text-xs text-gray-500 mt-1 font-semibold uppercase tracking-wider">Log Masuk Kakitangan</p>
        </div>

        <div id="notice-msg" class="hidden text-xs p-3 rounded-lg text-center border mb-4 font-semibold"></div>

        <!-- ================= SEKSYEN LOG MASUK ================= -->
        <div id="login-section">
            <button id="btn-google" type="button" class="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-2.5 px-4 rounded-lg transition shadow-sm mb-4 text-xs">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Log Masuk dengan Google
            </button>

            <div class="flex items-center my-4">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="px-3 text-gray-400 text-[10px] font-bold tracking-wider uppercase">Atau E-mel Rasmi</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="block text-gray-700 text-xs font-bold mb-1 uppercase">E-mel</label>
                    <input class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500" id="email" type="email" placeholder="contoh@kbs.gov.my" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-xs font-bold mb-1 uppercase">Kata Laluan</label>
                    <input class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500" id="password" type="password" placeholder="••••••••" required>
                </div>
                
                <div class="flex justify-end mb-4">
                    <button type="button" onclick="showResetView()" class="text-xs text-blue-600 font-semibold hover:underline">Lupa Kata Laluan?</button>
                </div>

                <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition shadow-md text-xs" type="submit">
                    Log Masuk Sistem
                </button>
            </form>

            <div class="mt-5 text-center border-t border-gray-100 pt-4">
                <p class="text-xs text-gray-500">Belum ada akaun? <button onclick="showSignupView()" class="text-blue-600 font-bold hover:underline">Daftar Baharu</button></p>
            </div>
        </div>

        <!-- ================= SEKSYEN SIGN UP (DAFTAR BAHARU) ================= -->
        <div id="signup-section" class="hidden">
            <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-3">
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1 uppercase">Nama Penuh</label>
                    <input class="shadow-sm border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500" id="reg-fullname" type="text" placeholder="Nama mengikut IC" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1 uppercase">E-mel Rasmi</label>
                    <input class="shadow-sm border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500" id="reg-email" type="email" placeholder="contoh@kbs.gov.my" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-bold mb-1 uppercase">Cipta Kata Laluan</label>
                    <input class="shadow-sm border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500" id="reg-password" type="password" placeholder="Minimum 6 abjad/nombor" minlength="6" required>
                </div>

                <button id="btn-signup" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition shadow-md text-xs mt-2" type="submit">
                    Daftar Akaun Baharu
                </button>
            </form>

            <div class="mt-5 text-center border-t border-gray-100 pt-4">
                <p class="text-xs text-gray-500">Sudah ada akaun? <button onclick="showLoginView()" class="text-blue-600 font-bold hover:underline">Log Masuk</button></p>
            </div>
        </div>

        <!-- ================= SEKSYEN LUPA KATA LALUAN ================= -->
        <div id="reset-section" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Masukkan E-mel Anda</label>
                <input type="email" id="reset-email" required placeholder="contoh@kbs.gov.my" class="w-full border border-gray-300 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="button" onclick="handleResetPassword()" id="btn-reset" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-2.5 rounded-lg transition shadow-md text-xs">
                Hantar Link Reset
            </button>
            <div class="text-center mt-3">
                <button type="button" onclick="showLoginView()" class="text-xs font-semibold text-gray-500 hover:underline">Batal & Kembali</button>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // KAWALAN PAPARAN (TOGGLE VIEW)
        function showLoginView() {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('signup-section').classList.add('hidden');
            document.getElementById('reset-section').classList.add('hidden');
            document.getElementById('form-subtitle').innerText = 'Log Masuk Kakitangan';
            hideNotice();
        }

        function showSignupView() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('signup-section').classList.remove('hidden');
            document.getElementById('reset-section').classList.add('hidden');
            document.getElementById('form-subtitle').innerText = 'Pendaftaran Akaun Baharu';
            hideNotice();
        }

        function showResetView() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('signup-section').classList.add('hidden');
            document.getElementById('reset-section').classList.remove('hidden');
            document.getElementById('form-subtitle').innerText = 'Reset Kata Laluan';
            hideNotice();
        }

        function showNotice(msg, isError = false) {
            const el = document.getElementById('notice-msg');
            el.innerText = msg;
            el.className = `text-xs p-3 rounded-lg text-center border mb-4 font-semibold ${isError ? 'bg-red-50 text-red-600 border-red-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}`;
            el.classList.remove('hidden');
        }

        function hideNotice() {
            document.getElementById('notice-msg').classList.add('hidden');
        }

        // FUNGSI LOG MASUK GOOGLE
        async function loginGoogle() {
            const { error } = await _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: 'https://aduan-kerosakan.is.iktbnchembong.com/index.html' }
            });
            if (error) showNotice("Ralat Google: " + error.message, true);
        }

        // FUNGSI LOG MASUK E-MEL & KATA LALUAN
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.disabled = true; btn.innerText = 'Memproses...';
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                showNotice("E-mel atau kata laluan tidak tepat.", true);
                btn.disabled = false; btn.innerText = 'Log Masuk Sistem';
            } else {
                window.location.href = 'index.html';
            }
        }

        // FUNGSI DAFTAR AKAUN BAHARU (SIGN UP)
        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-signup');
            btn.disabled = true; btn.innerText = 'Mencipta Akaun...';

            const fullName = document.getElementById('reg-fullname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            // 1. Cipta akaun di Supabase Auth
            const { data, error } = await _supabase.auth.signUp({
                email, password,
                options: { data: { full_name: fullName } }
            });

            if (error) {
                showNotice("Ralat Pendaftaran: " + error.message, true);
                btn.disabled = false; btn.innerText = 'Daftar Akaun Baharu';
            } else {
                // 2. Masukkan rekod profil awal ke user_profiles
                await _supabase.from('user_profiles').insert([{
                    email: email, full_name: fullName, role: 'PENDING', is_blocked: false
                }]);

                showNotice("Pendaftaran Berjaya! Sila log masuk. Sila minta Admin/KCPPP meluluskan akses anda.");
                document.getElementById('signup-form').reset();
                setTimeout(() => showLoginView(), 2000);
            }
        }

        // FUNGSI RESET KATA LALUAN
        async function handleResetPassword() {
            const email = document.getElementById('reset-email').value.trim();
            if (!email) return showNotice("Sila masukkan e-mel anda.", true);

            const { error } = await _supabase.auth.resetPasswordForEmail(email, {
                redirectTo: 'https://aduan-kerosakan.is.iktbnchembong.com/login.html'
            });

            if (error) showNotice("Ralat: " + error.message, true);
                else showNotice("Pautan reset telah dihantar ke e-mel anda!");
        }

        // TARIK LATAR BELAKANG & LOGO DARI DATABASE
        async function loadSystemTheme() {
            const { data } = await _supabase.from('system_settings').select('*').in('setting_key', ['system_logo', 'login_bg']);
            if(data) {
                const logo = data.find(d => d.setting_key === 'system_logo');
                if(logo && logo.setting_value) document.querySelectorAll('.sys-logo').forEach(img => img.src = logo.setting_value);
                
                const bg = data.find(d => d.setting_key === 'login_bg');
                if(bg && bg.setting_value) document.body.style.backgroundImage = `url('${bg.setting_value}')`;
            }
        }

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) window.location.href = 'index.html';
        }

        document.getElementById('btn-google').addEventListener('click', loginGoogle);
        loadSystemTheme();
        checkSession();
    </script>
</body>
</html>
