<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log Masuk Sistem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<!-- Ganti URL background di bawah -->
<body class="bg-[url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=1080&auto=format&fit=crop')] bg-cover bg-center bg-fixed min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-sm border border-white/50">
        <div class="text-center mb-8">
            <!-- Ganti URL logo di bawah. Ukuran ditetapkan tetap (fixed) -->
            <img src="https://via.placeholder.com/300x300.png?text=LOGO" alt="Logo Organisasi" class="w-24 h-24 mx-auto object-contain mb-4 bg-white p-2 rounded-xl shadow-sm border border-slate-100">
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Log Masuk</h1>
            <p class="text-xs text-slate-500 font-medium mt-1">Sistem Pengurusan Penyenggaraan</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">E-mel Pengguna</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="email" id="email" required class="w-full pl-9 pr-3 py-2.5 bg-white/50 border border-slate-300 rounded-lg text-sm focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition" placeholder="emel@domain.com">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wide">Kata Laluan</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="password" id="password" required class="w-full pl-9 pr-3 py-2.5 bg-white/50 border border-slate-300 rounded-lg text-sm focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg shadow-md transition transform active:scale-95 flex justify-center items-center gap-2 text-sm mt-2">
                <i class="fa-solid fa-right-to-bracket"></i> Log Masuk
            </button>
        </form>
    </div>

    <!-- Script Supabase Login bos (Tampal logik pengesahan Supabase asal bos di sini jika perlu) -->
</body>
</html>
