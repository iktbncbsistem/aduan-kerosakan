<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log Masuk Staf - Sistem Aduan Kerosakan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; } </style>

    
<link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    
</head>
<body class="bg-[image:linear-gradient(rgba(15,23,42,0.75),rgba(15,23,42,0.95)),url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center bg-fixed min-h-screen flex items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-md bg-white rounded-[24px] shadow-[0_20px_50px_rgba(0,0,0,0.3)] p-8 sm:p-10 relative overflow-hidden">
        
        <!-- Garisan Gradien Korporat (Biru ke Emerald) -->
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-700 via-blue-500 to-emerald-400"></div>

        <div class="text-center mb-8 mt-2">
            <!-- Logo Sistem -->
            <img src="https://cetaoxubcdityyhcvtsy.supabase.co/storage/v1/object/public/logo/logo.png" alt="Logo Organisasi" class="w-24 h-24 mx-auto object-contain mb-5 drop-shadow-sm">
            
            <!-- Tajuk & Slogan -->
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight mb-2">Sistem Penyenggaraan</h1>
            <p class="text-sm font-medium text-slate-500 leading-relaxed px-2">
                "Memastikan kelestarian fasiliti terpelihara dan beroperasi pada tahap optimum."
            </p>
        </div>

        <div id="notice-msg" class="hidden text-xs p-3 rounded-xl text-center border mb-6 font-semibold"></div>

        <!-- ================= SEKSYEN LOG MASUK ================= -->
        <div id="login-section">
            
            <!-- BUTANG GOOGLE (PREMIUM) -->
            <button id="btn-google" type="button" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-100 hover:border-blue-400 hover:bg-blue-50 hover:text-blue-700 text-slate-700 font-bold py-3.5 px-4 rounded-xl transition-all duration-300 shadow-sm hover:shadow-md text-sm mt-2">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Teruskan dengan Google
            </button>

            <!-- SEKSYEN KOSONG (SENGAJA DIBUANG UNTUK KEKEMASAN) -->
            <div class="hidden">
                <form id="login-form" onsubmit="handleLogin(event)"></form>
                <div id="signup-section"></div>
                <div id="reset-section"></div>
            </div>

        </div>

        <!-- FOOTER KECIL -->
        <p class="text-center text-[10px] text-slate-400 mt-10 font-bold uppercase tracking-widest">
            Hak Cipta Terpelihara &copy; 2026
        </p>

    </div>

    <script>
        // KAWALAN BUTANG BACK (PAKSA KE HOME SCREEN)
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            try { window.close(); } catch (e) {}
            const isAndroid = /android/i.test(navigator.userAgent || navigator.vendor || window.opera);
            if (isAndroid) {
                window.location.replace("intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end");
            } else {
                window.location.replace("about:blank");
            }
        };

        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showNotice(msg, isError = false) {
            const el = document.getElementById('notice-msg');
            el.innerText = msg;
            el.className = `text-xs p-3 rounded-xl text-center border mb-6 font-semibold ${isError ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}`;
            el.classList.remove('hidden');
        }

        // FUNGSI LOG MASUK GOOGLE
        async function loginGoogle() {
            const { error } = await _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: 'https://aduan-kerosakan.is.iktbnchembong.com/index.html' }
            });
            if (error) showNotice("Ralat Google: " + error.message, true);
        }

        async function loadSystemTheme() {
            const { data } = await _supabase.from('system_settings').select('*').in('setting_key', ['system_logo', 'login_bg']);
            if(data) {
                const logo = data.find(d => d.setting_key === 'system_logo');
                if(logo && logo.setting_value) document.querySelectorAll('.sys-logo').forEach(img => img.src = logo.setting_value);
                
                const bg = data.find(d => d.setting_key === 'login_bg');
                if(bg && bg.setting_value) document.body.style.backgroundImage = `linear-gradient(rgba(15,23,42,0.75),rgba(15,23,42,0.95)), url('${bg.setting_value}')`;
            }
        }

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) window.location.href = 'index.html';
        }

        document.getElementById('btn-google').addEventListener('click', loginGoogle);
        loadSystemTheme();
        checkSession();
    </script>
</body>
</html>
