<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk Staf - Sistem Aduan Kerosakan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <!-- Container Login -->
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 border border-gray-100">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">SISTEM ADUAN KEROSAKAN</h1>
            <p id="form-subtitle" class="text-sm text-gray-500 mt-2">Log Masuk Kakitangan (CPPP / KCPPP / Admin)</p>
        </div>

        <!-- Mesej Notis -->
        <div id="notice-msg" class="hidden text-sm p-3 rounded-lg text-center border mb-4 font-semibold"></div>

        <!-- Bahagian Log Masuk Utama -->
        <div id="login-section">
            <!-- Butang Log Masuk Google -->
            <button id="btn-google" type="button" class="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-2.5 px-4 rounded transition shadow-sm mb-4">
                <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Log Masuk dengan Google
            </button>

            <div class="flex items-center my-5">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="px-3 text-gray-400 text-xs font-medium tracking-wide">ATAU E-MEL RASMI</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Form Log Masuk Biasa -->
            <form id="login-form">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="email">E-mel</label>
                    <input class="shadow-sm appearance-none border border-gray-300 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="email" type="email" placeholder="contoh@iktbn.gov.my" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Kata Laluan</label>
                    <input class="shadow-sm appearance-none border border-gray-300 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" id="password" type="password" placeholder="••••••••" required>
                </div>
                
                <div class="flex justify-end mb-4">
                    <button type="button" onclick="toggleResetForm()" class="text-sm text-blue-600 hover:underline">Lupa Kata Laluan?</button>
                </div>

                <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded transition shadow-sm" type="submit">
                    Log Masuk Sistem
                </button>
            </form>
        </div>

        <!-- Form Reset Kata Laluan (Disorok pada mulanya) -->
        <form id="reset-form" class="space-y-5 hidden">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Masukkan E-mel Anda</label>
                <input type="email" id="reset-email" required placeholder="contoh@iktbn.gov.my" class="w-full border border-gray-300 rounded p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" id="btn-reset" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-2.5 rounded transition">
                Hantar Link Reset
            </button>

            <div class="text-center mt-4">
                <button type="button" onclick="toggleResetForm()" class="text-sm text-gray-500 hover:underline">Batal & Kembali ke Log Masuk</button>
            </div>
        </form>

        <div class="mt-6 text-center border-t pt-4">
            <a href="index.html" class="text-sm text-gray-500 hover:text-blue-600">← Kembali ke Halaman Utama</a>
        </div>
    </div>

    <script>
        // SETUP SUPABASE
        const SUPABASE_URL = 'https://cetaoxubcdityyhcvtsy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldGFveHViY2RpdHl5aGN2dHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTgyMjAsImV4cCI6MjEwMzkzNDIyMH0.vlhUaxM8VDSiOIgtwpPgdbC-xrDczFrx5g5iMqUjObc';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ELEMEN UI
        const noticeMsg = document.getElementById('notice-msg');
        const loginSection = document.getElementById('login-section');
        const resetForm = document.getElementById('reset-form');
        const subtitle = document.getElementById('form-subtitle');

        // PAPARAN MESEJ
        function showNotice(message, isError = true) {
            noticeMsg.innerText = message;
            noticeMsg.className = isError 
                ? "text-sm p-3 rounded-lg text-center border mb-4 font-semibold bg-red-50 text-red-600 border-red-200 block" 
                : "text-sm p-3 rounded-lg text-center border mb-4 font-semibold bg-blue-50 text-blue-600 border-blue-200 block";
            noticeMsg.classList.remove('hidden');
        }

        // 1. PENGHALAAN PINTAR (ROUTING)
        // 1. PENGHALAAN PINTAR & AUTO-DAFTAR PERANAN BERPUSAT
        async function routeUser(email) {
            try {
                // Semak peranan semasa dalam jadual berpusat
                let { data: profile, error } = await client.from('user_profiles').select('role').eq('email', email).maybeSingle();

                // Jika pengguna baru (First time login), daftar terus sebagai 'STAF'
                if (!profile) {
                    const { data: newProfile, error: insertError } = await client.from('user_profiles').insert([
                        { email: email, role: 'STAF' }
                    ]).select().single();
                    
                    if (insertError) throw new Error("Gagal mendaftar profil baharu.");
                    profile = newProfile;
                }

                const userRole = profile.role || 'STAF';

                // Tapis dan hantar ke dashboard yang betul
                if (userRole === 'ADMIN' || email === 'admin@iktbn.gov.my') {
                    window.location.href = 'admin.html';
                } else if (userRole === 'KCPPP') {
                    window.location.href = 'kcppp.html';
                } else if (userRole === 'CPPP') {
                    window.location.href = 'cppp.html';
                } else {
                    // Default kepada staf biasa
                    window.location.href = 'index.html'; 
                }
                
            } catch (err) {
                showNotice(err.message, true);
                const btn = document.getElementById('btn-login');
                if(btn) {
                    btn.disabled = false;
                    btn.innerText = "Log Masuk Sistem";
                }
            }
        }

        // 2. PEMANTAU STATUS SESI GOOGLE
        client.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session) {
                routeUser(session.user.email);
            }
        });

        // 3. FUNGSI BUTANG GOOGLE
        document.getElementById('btn-google').addEventListener('click', async () => {
            const btn = document.getElementById('btn-google');
            btn.disabled = true;
            btn.innerHTML = 'Menyambung...';
            
            const { error } = await client.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.href }
            });

            if (error) {
                showNotice("Ralat Google: " + error.message, true);
                btn.disabled = false;
                btn.innerHTML = 'Log Masuk dengan Google';
            }
        });

        // 4. FUNGSI LOG MASUK E-MEL BIASA
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            noticeMsg.classList.add('hidden');
            
            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.innerText = "Mengesahkan...";

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            const { error } = await client.auth.signInWithPassword({ email, password });

            if (error) {
                let errMsg = "Log masuk gagal.";
                if (error.message.includes('Invalid login')) errMsg = "E-mel atau kata laluan salah.";
                showNotice(errMsg, true);
                btn.disabled = false;
                btn.innerText = "Log Masuk Sistem";
            } else {
                routeUser(email);
            }
        });

        // 5. TOGGLE BORANG RESET KATA LALUAN
        function toggleResetForm() {
            noticeMsg.classList.add('hidden');
            if (loginSection.classList.contains('hidden')) {
                loginSection.classList.remove('hidden');
                resetForm.classList.add('hidden');
                subtitle.innerText = "Log Masuk Kakitangan (CPPP / KCPPP / Admin)";
            } else {
                loginSection.classList.add('hidden');
                resetForm.classList.remove('hidden');
                subtitle.innerText = "Tetapan Semula Kata Laluan";
            }
        }

        // 6. FUNGSI HANTAR RESET KATA LALUAN
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            noticeMsg.classList.add('hidden');
            
            const btnReset = document.getElementById('btn-reset');
            btnReset.disabled = true;
            btnReset.innerText = "Menghantar...";

            const resetEmail = document.getElementById('reset-email').value.trim();

            const { error } = await client.auth.resetPasswordForEmail(resetEmail, {
                redirectTo: window.location.origin + '/login.html', 
            });

            if (error) {
                showNotice(error.message, true);
            } else {
                showNotice("Link reset kata laluan telah dihantar. Sila semak peti masuk atau folder spam e-mel anda.", false);
                document.getElementById('reset-email').value = '';
            }

            btnReset.disabled = false;
            btnReset.innerText = "Hantar Link Reset";
        });
    </script>
</body>
</html>
